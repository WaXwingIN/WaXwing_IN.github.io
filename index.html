function macdChartAtSignal(chart,cutoff){
    if(!chart||!Array.isArray(chart.times))return null;

    const clipped={};
    for(const [key,value] of Object.entries(chart)){
        if(Array.isArray(value)&&value.length===chart.times.length)clipped[key]=value.slice(0,keep);
        else if(key==='标记'&&value&&typeof value==='object')clipped[key]=Object.fromEntries(Object.entries(value).filter(([,mark])=>Number.isInteger(mark?.index)&&mark.index<keep));
        else clipped[key]=value;
    }

async function fetchStaticObject(urls,path,expectedHash=null){

    let settled=false,backupTimer,winner=-1;
    try{
        return await new Promise((resolve,reject)=>{
            let started=0,finished=0,lastError;
            const backups=()=>{while(started<urls.length)request(started++)};
            const request=async index=>{
                const timer=setTimeout(()=>controllers[index].abort(),20000);
                try{
                    const response=await fetch(urls[index],{cache:'force-cache',credentials:'omit',signal:controllers[index].signal});
                    if(!response.ok)throw new Error('模型数据 HTTP '+response.status+'：'+path);
                    const bytes=await response.clone().arrayBuffer();
                    if(expected){
                        const digest=await crypto.subtle.digest('SHA-256',bytes);

                    // establish that a stalled response body has completed.
                    JSON.parse(new TextDecoder().decode(bytes));
                    if(!settled){winner=index;settled=true;resolve(response)}
                }catch(error){lastError=error;if(!settled)backups()}
                finally{clearTimeout(timer);finished++;if(!settled&&finished===urls.length){settled=true;reject(lastError)}}
            };
            request(started++);
            if(urls.length>1)backupTimer=setTimeout(backups,800);
        });
    }finally{
        settled=true;clearTimeout(backupTimer);
        controllers.forEach((c,index)=>{if(index!==winner)c.abort();if(typeof pageRequestControllers!=='undefined')pageRequestControllers.delete(c)});
    }
}

function dailyChart(path=[],ref=[]){
    const values=[...path,...ref].filter(Number.isFinite);
    if(!values.length)return '';
    const lo=Math.min(...values)-1,hi=Math.max(...values)+1;
    const points=a=>a.map((v,i)=>`${5+i*210/Math.max(1,a.length-1)},${79-(v-lo)/(hi-lo)*74}`).join(' ');
    return `<svg class="daily-plot" viewBox="0 0 220 84" role="img" aria-label="蓝色候选与橙色参考股收盘走势"><polyline points="${points(ref)}" fill="none" stroke="#e09521" stroke-width="2"/><polyline points="${points(path)}" fill="none" stroke="#2563eb" stroke-width="2"/></svg>`;
}

    const rawEventDate=String(row?.['事件实际日期']||''),eventDigits=rawEventDate.replace(/\D/g,'').slice(0,8);
    const eventDate=eventDigits.length===8?`${eventDigits.slice(0,4)}-${eventDigits.slice(4,6)}-${eventDigits.slice(6,8)}`:rawEventDate;
    const keys=[];
    if(model==='30分钟一买')keys.push([model,code,row?.['Price_A日期']||'',row?.['Price_B日期']||''].join('|'));
    else if(model==='日线盘整背驰一买'){
        const actualKey=[model,'实际',code,row?.['G2日期']||'',row?.['D3日期']||''].join('|');
        if(row?.['历史回放']){
            keys.push([model,'回放',code,row?.['G2日期']||'',row?.['D3日期']||'',eventDate,row?.['回放事件']||''].join('|'));

            if(!eventDate&&row?.['状态']==='转折确认'&&row?.['实际确认时间'])keys.push(actualKey);

function d2ArchivedEvents(){
    const days=Array.isArray(dailyExtra.d2History?.days)?dailyExtra.d2History.days:[];
    const records=days.filter(day=>day.date).flatMap(day=>(day.rows||[]).filter(row=>!d2ManuallyExcluded(row.code,day.date)).flatMap(row=>(row.d2_alert_events||[]).filter(event=>event.event_key&&String(event.first_observed_at||'').slice(0,10)===day.date&&String(event.confirmed_at||'').slice(0,10)===day.date).map(event=>({row,event,date:day.date}))));
    const unique=new Map();
    for(const item of records){
        const key=`${item.date}|${item.row.code}|${item.event.source}|${String(item.event.confirmed_at).slice(0,19)}|${item.event.episode_id||''}`,prior=unique.get(key);
        if(!prior){unique.set(key,item);continue}
        const original=String(item.event.first_observed_at)<String(prior.event.first_observed_at)?item:prior;
        unique.set(key,{...original,event:{...original.event,first_observed_at:[prior.event.first_observed_at,item.event.first_observed_at].filter(Boolean).sort()[0],last_observed_at:[prior.event.last_observed_at,item.event.last_observed_at].filter(Boolean).sort().reverse()[0]}});
    }
    return [...unique.values()];
}

async function d2NotificationDeadline(operation,milliseconds,message){

}

    return digits.length===8?`${digits.slice(0,4)}-${digits.slice(4,6)}-${digits.slice(6,8)}`:raw.slice(0,10);
}
function reminderDateGroups(events){
    const groups=new Map();
    for(const event of events){
        if(!event.triggered_at)continue;
        const date=shortCycleDate(event.triggered_at);
        if(!groups.has(date))groups.set(date,{date,rows:[]});
        groups.get(date).rows.push(event);
    }
    return [...groups.values()];
}
function reminderDateOptions(groups,{latestDate='',latestRows,latestValue='latest',selectedDate='latest'}={}){
    // One option per trigger day; the latest snapshot uses the same label,
    // including when it has no confirmed reminders. Values keep existing loaders compatible.
    const byDate=new Map();
    for(const group of groups){
        if(!group.date)continue;
        const date=shortCycleDate(group.date);
        const previous=byDate.get(date);
        byDate.set(date,{date,value:group.value??group.date,rows:[...(previous?.rows||[]),...(group.rows||[])]});
    }
    const latest=latestDate?shortCycleDate(latestDate):'';
    if(latest)byDate.set(latest,{date:latest,value:latestValue,rows:latestRows??byDate.get(latest)?.rows??[]});
    const dates=[...byDate.keys()].sort().reverse();
    const requested=selectedDate==='latest'?latest:selectedDate==='all'?'':shortCycleDate(selectedDate);
    const selected=byDate.has(requested)?requested:dates[0];
    const selectedDateKey=selectedDate==='all'?'':selected;
    return dates.map(date=>{
        const group=byDate.get(date);
        return `<option value="${safe(group.value)}" data-reminder-date="${safe(date)}"${selectedDateKey===date?' selected':''}>${safe(formatDate(date))} · ${reminderStockCount(group.rows)}只</option>`;
    }).join('');
}
function shortCycleCompactTime(value){

    const full=String(formatDateTime(value)),match=full.match(/^\d{4}[/-](\d{2})[/-](\d{2})\s+(\d{2}):(\d{2})/);
    return match?`<time title="${safe(full)}">${match[1]}/${match[2]} ${match[3]}:${match[4]}</time>`:safe(full);
}

function freezeIdentityColumns(table){
    const header=[...table.tHead?.rows[0]?.cells||[]];
    if(!header.length)return;
    const labels=header.map(cell=>cell.textContent.replace(/\s+/g,' ').trim().replace(/\s*[↑↓↕]$/,''));
    const compactIdentity=['序号','排名','选股时排名'].includes(labels[0]);
    if(compactIdentity)table.classList?.add('compact-identity-table');
    const cols=header.length>1?[0,1]:[0];
    for(const row of table.rows){
        if(row.cells.length!==header.length)continue;
        [...row.cells].forEach((cell,index)=>{
            if(index>=2&&cell.classList.contains('stock-sticky')){
                cell.classList.remove('stock-sticky');cell.style.left='';cell.style.zIndex='';
            }
            if(compactIdentity&&index===0)cell.classList.add('identity-rank-cell');
            if(index<2&&/^(股票|名称|代码)/.test(labels[index]))cell.classList.add('stock-identity-cell');
        });
    }
    let offset=0;
    cols.forEach((index,order)=>{
        const measured=header[index]?.getBoundingClientRect().width||0;
        const width=measured||(compactIdentity&&order===0?52:190);
        // HTMLTableElement.rows contains only this table's rows. A descendant
        // query also reaches the buy/sell condition tables and makes their
        // first cells sticky above the outer header while scrolling.
        [...table.rows].forEach(row=>{
            if(row.cells.length!==header.length)return;
            const cell=row.cells[index];
            if(!cell)return;
            cell.classList.add('stock-sticky');
            cell.style.left=offset+'px';
            cell.style.zIndex=String((cell.tagName==='TH'?6:3)-order);
        });
        offset+=width;
    });
}

function enableRankSorting(table,sorts,key){
    const header=[...table.tHead?.rows[0]?.cells||[]];
    const columns=header.map((cell,index)=>({cell,index,label:cell.textContent.trim()}))
        .filter(({cell,label})=>/^(?:原|选股时|实盘)?排名$/.test(label)&&!cell.querySelector('button,a,input,select'));
    if(!columns.length)return;
    // Move the original nodes so details, copy controls and event handlers stay attached.
    const bodies=[...table.tBodies].map(body=>{
        const groups=[];
        for(const row of body.rows){
            if(row.cells.length===header.length)groups.push({rows:[row],order:groups.length});
            else if(groups.length)groups[groups.length-1].rows.push(row);
        }
        return {body,groups};
    });
    const rankOf=(group,index)=>{
        const match=group.rows[0].cells[index]?.textContent.match(/^\s*#?\s*(\d+)(?:\D|$)/);
        return match?Number(match[1]):null;
    };
    const controls=[];
    const apply=()=>{
        const sort=sorts.get(key);
        for(const {body,groups} of bodies){
            const ordered=[...groups];
            if(sort)ordered.sort((a,b)=>{
                const left=rankOf(a,sort.index),right=rankOf(b,sort.index);
                if(left==null||right==null)return left===right?a.order-b.order:left==null?1:-1;
                return (left-right)*sort.direction||a.order-b.order;
            });
            for(const group of ordered)for(const row of group.rows)body.append(row);
        }
        for(const {cell,index,label,button} of controls){
            const active=sort?.index===index;
            cell.setAttribute('aria-sort',active?(sort.direction===1?'ascending':'descending'):'none');
            button.textContent=label+' '+(active?(sort.direction===1?'↑':'↓'):'↕');
            button.classList.toggle('active',active);
            button.title=active?(sort.direction===1?'点击按排名降序':'点击恢复默认顺序'):'点击按排名升序';
        }
    };
    for(const {cell,index,label} of columns){
        const button=document.createElement('button');
        button.type='button';button.className='sort-button rank-sort-button';
        button.addEventListener('click',()=>{
            const current=sorts.get(key);
            if(current?.index===index&&current.direction===-1)sorts.delete(key);
            else sorts.set(key,{index,direction:current?.index===index?-1:1});
            apply();
        });
        cell.replaceChildren(button);
        controls.push({cell,index,label,button});
    }
    // An untouched table must retain its model's default order.
    if(sorts.has(key))apply();
    else for(const {cell,label,button} of controls){
        cell.setAttribute('aria-sort','none');button.textContent=label+' ↕';button.title='点击按排名升序';
    }
}

function moveReasonColumns(root){
    const buyLabels=new Set(['买入提醒条件','买入提醒','买入条件与触发时间']);
    for(const table of root.querySelectorAll('table')){
        const header=table.tHead?.rows?.[0];
        if(!header)continue;
        const triggerIndex=[...header.cells].findIndex(cell=>['提醒触发时间','选出／提醒触发时间','提醒触发／观察时间'].includes(cell.textContent.trim()));
        if(triggerIndex>=0&&[...header.cells].some(cell=>cell.textContent.trim()==='买入提醒条件')){
            const count=header.cells.length;
            for(const row of table.tBodies[0]?.rows||[]){
                if(row.cells.length===count)row.cells[triggerIndex].remove();
            }
            header.cells[triggerIndex].remove();
        }
        const index=[...header.cells].findIndex(cell=>cell.textContent.trim()==='入选原因');
        if(index>=0&&index!==header.cells.length-1){
            const count=header.cells.length,reason=header.cells[index];
            reason.classList.add('focus-reason-head');header.append(reason);
            for(const row of table.tBodies[0]?.rows||[]){
                if(row.cells.length===count)row.append(row.cells[index]);

function m30CurrentTradingDate(){

    // Only a calendar covering today can distinguish a holiday from missing calendar data.
    if(dates.some(day=>day>=today))return dates.filter(day=>day<=today).sort().pop()||today;
    const day=new Date(today+'T12:00:00+08:00').getUTCDay();
    if(day===0||day===6){const stamp=new Date(today+'T00:00:00Z');stamp.setUTCDate(stamp.getUTCDate()-(day===6?1:2));return stamp.toISOString().slice(0,10)}

// Both SVGs already use the same dates and x(index). Keep their independent

function syncChartTimeAxes(container){
    const scrollers=[...container.querySelectorAll('.macd-chart-scroll')];
    if(scrollers.length<2)return;
    let updating=false;
    scrollers.forEach(source=>source.addEventListener('scroll',()=>{
        if(updating)return;
        const span=Math.max(0,source.scrollWidth-source.clientWidth);
        const progress=span?source.scrollLeft/span:0;
        updating=true;
        for(const target of scrollers){
            if(target===source)continue;
            const next=progress*Math.max(0,target.scrollWidth-target.clientWidth);
            if(Math.abs(target.scrollLeft-next)>1)target.scrollLeft=next;
        }
        updating=false;
    },{passive:true}));
}

function installHistoricalEvidenceHandlers(content){
    const labels={daily_chart:'日线',weekly_chart:'周线',minute_chart:'分钟线'};
    content.querySelectorAll('[data-historical-evidence]').forEach(button=>button.onclick=async()=>{
        const at=button.dataset.historicalTrigger;
        try{
            if(!dailyExtra.chartEvidenceIndex?.by_event){
                const indexResponse=publicCloudPage?await publicCloudFetch('chart_evidence_index.json'):await fetch('data/chart_evidence_index.json',{cache:'no-store'});
                if(!indexResponse.ok)throw new Error('图表索引无法读取');
                dailyExtra.chartEvidenceIndex=await indexResponse.json();
            }
            const index=dailyExtra.chartEvidenceIndex.by_event;
            const direct=button.dataset.historicalEvidence+'|'+at;
            const code=button.dataset.historicalCode;
            const key=code?Object.keys(index).find(value=>value.startsWith(`D2|${code}|`)&&value.endsWith('|'+at))||
                Object.keys(index).find(value=>value.startsWith(`D2-display|${code}|`)&&value.endsWith('|'+at)):direct;
            const entry=index[key];
            if(entry?.status==='unavailable'){
                const unavailable=new Error('历史行情暂无法核验，提醒记录已保留');
                unavailable.code='unavailable_evidence';throw unavailable;
            }
            if(!entry||!/^evidence_charts\/[0-9a-f]{64}\.json$/.test(entry.asset))throw new Error('该提醒的图表未归档');
            const response=publicCloudPage?await publicCloudFetch(entry.asset):await fetch('data/'+entry.asset,{cache:'no-store'});
            if(!response.ok)throw new Error('图表文件无法读取');
            const bytes=await response.arrayBuffer();
            const digest=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))]
                .map(value=>value.toString(16).padStart(2,'0')).join('');
            if(digest!==entry.sha256)throw new Error('图表文件校验失败');
            const evidence=JSON.parse(new TextDecoder().decode(bytes));
            if(evidence.cutoff!==at)throw new Error('图表确认时间不一致');
            const periods=(entry.periods||[]).filter(period=>{
                const chart=evidence[period],times=chart?.times||[],close=chart?.['收盘']||[],marker=chart?.['标记']?.Signal;
                return times.length&&close.length===times.length&&times.every((time,i)=>String(time)<=at&&(!i||String(times[i-1])<=String(time)))&&
                    marker?.index===times.length-1&&marker?.confirmed_at===at;
            });
            if(periods.length!==(entry.periods||[]).length||!periods.length)throw new Error('该提醒有周期图表不完整');
            let period=periods[0];
            const overlay=document.createElement('div');overlay.className='second-detail-modal m30-detail-modal';
            const render=()=>{overlay.innerHTML=`<section class="second-detail-dialog m30-detail-dialog" role="dialog" aria-modal="true" aria-label="历史图表证据"><header class="second-detail-head"><h3>${safe(button.dataset.historicalModel)} · ${safe(formatDateTime(at))}</h3><button type="button" class="second-detail-close" data-evidence-close aria-label="关闭">×</button></header><p class="daily-note">图表冻结于提醒确认时刻；红点标出触发位置。</p><label class="macd-period-select">查看周期 <select data-evidence-period>${periods.map(value=>`<option value="${value}"${value===period?' selected':''}>${labels[value]||value}</option>`).join('')}</select></label>${integratedMacdChart(evidence[period],labels[period]||period)}</section>`;
                overlay.querySelector('[data-evidence-close]').onclick=()=>overlay.remove();
                overlay.querySelector('[data-evidence-period]').onchange=event=>{period=event.target.value;render()};};
            render();overlay.onclick=event=>{if(event.target===overlay)overlay.remove()};content.append(overlay);
        }catch(error){
            const previous=button.parentElement?.querySelector('.chart-evidence-status');
            if(previous)previous.remove();
            button.insertAdjacentHTML('afterend',`<span class="chart-evidence-status" role="status">${error.code==='unavailable_evidence'?safe(error.message):'图表暂未同步，扫描完成后可查看'}</span>`);
        }
    });
}

function classIiArchiveFromSnapshots(payload){
    if(!Array.isArray(payload?.sessions))throw new Error('类二买原扫描归档不可用');
    const records=new Map(),day=payload.daily_date;
    for(const session of [...payload.sessions].sort((a,b)=>String(a.date).localeCompare(String(b.date)))){
        const group=session.models?.second_buy||{};
        for(const row of group.research_rows||group.rows||[]){
            const code=String(row.code||'').padStart(6,'0');if(!/^\d{6}$/.test(code))continue;
            const previous=records.get(code);
            records.set(code,{...previous,code,name:row.name,first_seen:previous?.first_seen||session.date,
                last_seen:session.date,status:'待核验',status_reason:'原扫描归档；有效性待复核',
                latest_row:row,reminders:previous?.reminders||[]});
        }
    }
    for(const entry of dailyExtra.d2History?.days||[])for(const row of entry.rows||[]){
        const record=records.get(String(row.code).padStart(6,'0'));if(!record)continue;
        const known=new Set(record.reminders.map(event=>event.event_key));
        for(const event of row.d2_alert_events||[])if(event.event_key&&!known.has(event.event_key)){
            record.reminders.push({...event,kind:'D2联动触发'});known.add(event.event_key);
        }
    }
    const sectors=dailyExtra.stockSectorMap||{};
    const latestGroup=payload.sessions.find(session=>session.date===day)?.models?.second_buy||{};
    const archivedCurrent=new Set((latestGroup.research_rows||latestGroup.rows||[]).map(row=>String(row.code).padStart(6,'0'))).size;
    return {data_through:day,generated_at:payload.generated_at,scan_status:'归档回退',archived_current_count:archivedCurrent,
        stocks:[...records.values()],sectors:Object.fromEntries([...records.keys()].filter(code=>sectors[code]?.name).map(code=>[code,sectors[code].name]))};
}

        return before !== JSON.stringify([dailyExtra.d2Proximity, dailyExtra.d2History]);
    }
    async function refresh() {
        if (pending || typeof d2DesktopEvents !== 'function' || typeof sendD2M30DesktopNotification !== 'function') return;
        pending = true;
        try {
            const version = Math.floor(Date.now() / 15000);
            const response = await fetch('https://raw.githubusercontent.com/WaXwingIN/WaXwing_IN.github.io/signal-feed/d2-alerts.json?v=' + version,
                {cache: 'no-store', credentials: 'omit', signal: AbortSignal.timeout(10000)});
            if (!response.ok) throw new Error('提醒数据暂不可用');
            const checked = await verified(await response.json());
            const snapshot = {payload: checked.payload, rows: checked.payload.rows, offline: false};
            const scan = d2NotificationTime(checked.payload.generated_at), now = Date.now();
            if (!Number.isFinite(scan) || scan > now || checked.payload.daily_date !== new Date(now + 8 * 3600000).toISOString().slice(0, 10)) return;
            if (current && scan < d2NotificationTime(current.payload.generated_at)) return;
            current = snapshot;
            const changed = syncDisplay(snapshot);
            const meta = document.getElementById?.('meta');
            if (meta) {
                let stamp = document.getElementById('d2LiveReminderScanAt');
                if (!stamp) { stamp = document.createElement('span'); stamp.id = 'd2LiveReminderScanAt'; meta.appendChild(stamp); }
                stamp.textContent = ' · 提醒扫描 ' + checked.payload.generated_at.replace('T', ' ').replace(/\+08:00$/, '');
            }
            // A failed OS delivery is retried even when the feed bytes are unchanged.
            try {
                if (now - scan <= 45 * 60000) await sendD2M30DesktopNotification(snapshot);
            } finally {
                if (changed && typeof activeDaily !== 'undefined' && activeDaily === 'd2_alert' && typeof draw === 'function') draw();
                if (now - scan <= 45 * 60000) display(snapshot);
            }
            lastDigest = checked.digest;
        } catch (error) {
            // Existing verified page data remains usable; no cloud/private fallback.
            if (typeof setD2PushStatus === 'function' && typeof d2NotificationEnabled === 'function' && d2NotificationEnabled()) setD2PushStatus('最新提醒同步暂不可用，正在重试；已显示的记录保留。', 'error');
        } finally { pending = false; }
    }
    // Exposed for diagnostics, including verification without sending a notice.
    window.WaXwingD2SignalFeed = {refresh, verified, state: () => ({digest: lastDigest, scanAt: current?.payload.generated_at || ''})};
    setTimeout(refresh, 1500);
    setInterval(refresh, 15000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
})();
