function drawFocus(payload){

function focusReview(session,model){

    const allRows=[...(review.rows||[])].sort((a,b)=>a['重点排名']-b['重点排名']);
    if(!allRows.length)return '<p class="focus-note">本期重点名单没有可结算行情。</p>';
    const rows=allRows.filter(r=>r['模型']===model),q=performanceSummary(allRows);
    const location=rows.length?`当前${esc(model)}表内有${rows.length}只，已在原排名行标星。`:`当前${esc(model)}表内没有；请切换另一模型Tab查看星标位置。`;
    return `<div class="focus-review"><strong>当时额外精选（跨模型）</strong> · ${esc(review.version)}<br>${allRows.map(r=>`${esc(r['重点排名'])}. ${esc(r['名称'])}（${esc(r['模型'])}原排名${esc(r['排名'])}）：${performancePercent(r['次日涨跌幅%'])}`).join('；')}<br>3只整体上涨率 ${performancePercent(q.upRate)} · 平均 ${performancePercent(q.average)}。${location}仅对比收盘表现，不代表交易收益。</div>`;
}

const esc=s=>String(s??'-').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pageDate=value=>{const digits=String(value??'').replace(/\D/g,'');return digits.length>=8?`${digits.slice(0,4)}/${digits.slice(4,6)}/${digits.slice(6,8)}`:'--'};
const pageDateTime=value=>{const text=String(value??''),date=pageDate(text),match=text.match(/(?:T|\s)(\d{2}:\d{2}:\d{2})/);return date==='--'?'--':date+(match?' '+match[1]:'')};
const tableSorts=new Map();

function table(rows,emptyText='暂无股票。',id=''){

if(id==='首踩10日线')rows=[...rows].sort((a,b)=>(a['排名']??a['选股依据']?.['排名']??999)-(b['排名']??b['选股依据']?.['排名']??999)).map(row=>{const source=row['选股依据']||row,hidden=new Set(['排名','原排名','代码','名称','爆发等级']);const clean=Object.fromEntries(Object.entries(row).filter(([key])=>!key.startsWith('explosive_')&&!hidden.has(key)));const rank=Number(row['排名']??999),level=source.explosive_level||'未评分';const group=rank<=3?(level==='低'?'Top3 · 低分观察':'Top3 · 核心'):rank<=5?'Top4～5 · 观察':'其余候选';const result={'回撤排序分':source.fib_rank_score??source.explosive_score??null,'关注层级':group,'代码':row['代码'],'名称':row['名称'],...clean};Object.defineProperty(result,'爆发等级',{value:source.explosive_level||'未评分',enumerable:false});return result});
let ks=Object.keys(rows[0]).filter(k=>k!=='选股依据');if(!rulesUnlocked){const publicKeys=new Set(['排名','代码','名称','股票','选股收盘','次日收盘','次日涨跌幅%','结果','次日涨跌结果','3日收益','5日收益','回撤排序分','关注层级','盘中状态','首次盘中发现','最近盘中命中']);ks=ks.filter(k=>publicKeys.has(k))}if(ks.includes('次日涨跌幅%')&&ks.includes('结果'))ks=ks.filter(k=>k!=='结果').map(k=>k==='次日涨跌幅%'?'次日涨跌结果':k);if(ks.includes('排名'))ks=['排名',...ks.filter(k=>k!=='排名')];

let displayed=[...rows];if(sort)displayed.sort((a,b)=>{let av=a[sort.key],bv=b[sort.key],am=av==null||av===''||!Number.isFinite(Number(av)),bm=bv==null||bv===''||!Number.isFinite(Number(bv));return am||bm?(am===bm?0:am?1:-1):(Number(av)-Number(bv))*sort.direction});
const formatValue=value=>value&&typeof value==='object'?Object.entries(value).map(([key,item])=>`${key}：${item}`).join('；'):value;
const dateText=value=>{const raw=String(value??'');const m=raw.match(/^(\d{4})-?(\d{2})-?(\d{2})(.*)$/);if(!m)return raw;const time=m[4].trim().replace(/^T/,' ');return `${m[1]}/${m[2]}/${m[3]}${time?time:''}`};
const cell=(key,value,row)=>{if(key==='回撤排序分'){if(value==null)return '<td>未评分</td>';const level=row['爆发等级'],cls=level==='强'?'strong':level==='中'?'medium':level==='观察'?'watch':'low';return `<td><span class="explosive-badge explosive-${cls}"><b>${Number(value).toFixed(1)}</b><small>${esc(level)}</small></span></td>`;}if(key==='次日涨跌结果'){const number=Number(row['次日涨跌幅%']),up=number>0,down=number<0;return `<td class="${up?'pos':down?'neg':'flat'}">${up?'▲':down?'▼':'•'} ${Number.isFinite(number)?`${up?'+':''}${number.toFixed(2)}%`: '—'} ${esc(row['结果']||'')}</td>`}if(value==='是'||value==='否')return `<td><span class="yn-mark ${value==='是'?'yn-yes':'yn-no'}" title="${value}">${value==='是'?'✓':'✗'}</span></td>`;if(key==='KDJ优先'&&value==='达标')return '<td><span class="target-badge">✓ 达标</span></td>';let number=Number(value),signed=key==='距涨停日开盘价%'&&value!==null&&value!==''&&Number.isFinite(number),shown=signed&&number>0?`+${value}`:formatValue(value),isDate=/(日期|时间|日期日|生成时间|快照日|选股日|结果日|最近涨停日|首次回踩日)/.test(key)&&typeof shown==='string';if(isDate)shown=dateText(shown);const cls=signed?(number>0?'pos':(number<0?'neg':'flat')):'';return `<td${cls?` class="${cls}"`:''}>${esc(shown)}</td>`};
const renderTable=items=>'<div class="wrap"><table><thead><tr>'+ks.map(k=>{let canSort=sortable&&['排名','复涨特征分','回撤排序分'].includes(k),active=sort&&sort.key===k;return `<th${canSort?` aria-sort="${active?(sort.direction===1?'ascending':'descending'):'none'}"`:''}>${canSort?`<button type="button" class="sort-button${active?' active':''}" data-sort-table="${esc(id)}" data-sort-key="${esc(k)}">${esc(k)} ${active?(sort.direction===1?'↑':'↓'):'↕'}</button>`:esc(k)}</th>`}).join('')+'</tr></thead><tbody>'+items.map(r=>'<tr>'+ks.map(k=>cell(k,r[k],r)).join('')+'</tr>').join('')+'</tbody></table></div>';

function performanceSummary(rows){

    const up=changes.filter(value=>value>0).length;
    return {
        total:rows.length,valid:valid.length,up,
        down:changes.filter(value=>value<0).length,
        limitUp:changes.filter(value=>value>=9.9).length,
        upRate:valid.length?(up/valid.length*100).toFixed(1):null,
        average:valid.length?(changes.reduce((sum,value)=>sum+value,0)/valid.length).toFixed(2):null

}

async function dispatchD2SystemNotification(title,options){

function freezeIdentityColumns(table){
    const header=[...table.tHead?.rows[0]?.cells||[]];
    if(!header.length)return;
    const labels=header.map(cell=>cell.textContent.replace(/\s+/g,' ').trim());
    const wanted=['爆发潜力评分','排名','选股时排名','代码','名称','股票'];
    const indexes=[];
    labels.forEach((label,index)=>{if(wanted.some(name=>label===name||label.startsWith(name)))indexes.push(index)});
    header.forEach((cell,index)=>{if(cell.classList.contains('stock-sticky')&&!indexes.includes(index))indexes.push(index)});
    if(!indexes.length)indexes.push(0);
    const cols=[...new Set(indexes)].sort((a,b)=>a-b);
    let offset=0;
    cols.forEach((index,order)=>{
        const measured=header[index]?.getBoundingClientRect().width||0;
        const width=Math.max(measured,index===cols[0]?56:72);
        table.querySelectorAll('tr').forEach(row=>{
            const cell=row.cells[index];
            if(!cell)return;
            cell.classList.add('stock-sticky');
            cell.style.left=offset+'px';
            cell.style.zIndex=String((cell.tagName==='TH'?6:3)-order);
        });
        offset+=width;
    });
}

async function copyStockCode(button){

            const control=document.createElement(insideControl?'span':'button');

function dailyConsolidationChart(row,kind){
    const chart=row['形态图']||{},dates=chart['日期']||[],n=dates.length;
    if(n<2)return '';
    const series=key=>(chart[key]||[]).map(value=>Number(value));
    const opens=series('开盘'),closes=series('收盘'),highs=series('最高'),lows=series('最低'),dif=series('DIF'),dea=series('DEA'),hist=series('MACD');
    const price=kind==='价格',W=1200,H=255,x=i=>46+i*(W-92)/(n-1);
    const bounds=(price?[...highs,...lows]:[...dif,...dea,...hist,0]).filter(Number.isFinite);
    const lo=Math.min(...bounds),hi=Math.max(...bounds),span=hi-lo||1,y=v=>H-34-(v-lo)/span*(H-58);
    const line=(values,color,weight=2)=>`<polyline points="${values.map((value,i)=>`${x(i)},${y(value)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="${weight}"/>`;
    const centers=chart['中枢']||{},nodes=chart['节点']||{},legs=chart['比较段']||{},at=date=>dates.indexOf(String(date||''));
    let draw='';
    if(price){
        const from=at(centers.start_date),to=at(centers.end_date),zd=Number(centers.ZD),zg=Number(centers.ZG);
        if(from>=0&&to>=0&&Number.isFinite(zd)&&Number.isFinite(zg))draw+=`<rect x="${x(from)}" y="${y(zg)}" width="${Math.max(1,x(to)-x(from))}" height="${Math.max(1,y(zd)-y(zg))}" fill="#facc15" fill-opacity=".28" stroke="#d97706" stroke-width="2"/><text x="${x(from)+5}" y="${Math.max(16,y(zg)-6)}" fill="#92400e" font-size="14">重叠区[${safe(zd)},${safe(zg)}]</text>`;
        draw+=closes.map((value,i)=>{if(![opens[i],highs[i],lows[i],value].every(Number.isFinite))return '';const color=value>=opens[i]?'#dc2626':'#16a34a';return `<line x1="${x(i)}" x2="${x(i)}" y1="${y(highs[i])}" y2="${y(lows[i])}" stroke="${color}"/><rect x="${x(i)-1.8}" y="${Math.min(y(opens[i]),y(value))}" width="3.6" height="${Math.max(1,Math.abs(y(opens[i])-y(value)))}" fill="${color}"/>`}).join('');
        const ordered=['H0','D1','G1','D2','G2','D3'].map(name=>({name,marker:nodes[name]})).filter(item=>item.marker&&at(item.marker.date)>=0);
        if(ordered.length>1)draw+=`<polyline points="${ordered.map(item=>`${x(at(item.marker.date))},${y(Number(item.marker.price))}`).join(' ')}" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="5 3"/>`;
        for(const [left,right,color] of [['H0','D1','#7c3aed'],['G2','D3','#be123c']]){if(nodes[left]&&nodes[right]&&at(nodes[left].date)>=0&&at(nodes[right].date)>=0)draw+=`<line x1="${x(at(nodes[left].date))}" y1="${y(Number(nodes[left].price))}" x2="${x(at(nodes[right].date))}" y2="${y(Number(nodes[right].price))}" stroke="${color}" stroke-width="4"/>`}
        for(const [name,marker] of Object.entries(nodes)){const i=at(marker.date);if(i<0)continue;const value=Number(marker.price),color=name==='D3'?'#be123c':'#2563eb';draw+=`<circle cx="${x(i)}" cy="${y(value)}" r="4" fill="${color}"><title>${safe(name)} ${safe(marker.date)} / ${safe(marker.price)}；确认 ${safe(marker.confirm_time||'待确认')}</title></circle><text x="${x(i)+4}" y="${Math.max(16,y(value)-7)}" fill="${color}" font-size="14" font-weight="bold">${safe(name)}</text>`}
    }else{
        draw=`<line x1="46" x2="1154" y1="${y(0)}" y2="${y(0)}" stroke="#94a3b8" stroke-dasharray="5 4"/>`;
        draw+=hist.map((value,i)=>`<line x1="${x(i)}" x2="${x(i)}" y1="${y(0)}" y2="${y(value)}" stroke="${value<0?'#06b6d4':'#ef4444'}" stroke-width="3"/>`).join('')+line(dif,'#2563eb',2.5)+line(dea,'#d97706',2);
        for(const [key,color] of [['A','#7c3aed'],['C','#be123c']]){const leg=legs[key]||{},from=at(leg.start),to=at(leg.end);if(from<0||to<0)continue;draw+=`<rect x="${x(from)}" y="16" width="${Math.max(1,x(to)-x(from))}" height="${H-47}" fill="${color}" fill-opacity=".07" stroke="${color}" stroke-dasharray="5 4"/><text x="${x(from)+5}" y="29" fill="${color}" font-size="14" font-weight="bold">${key==='A'?'前段A':'末段C'}</text>`}
    }

}

// Both SVGs already use the same dates and x(index). Keep their independent

function syncChartTimeAxes(container){
    const scrollers=[...container.querySelectorAll('.macd-chart-scroll')];
    if(scrollers.length<2)return;
    let updating=false;
    scrollers.forEach(source=>source.addEventListener('scroll',()=>{
        if(updating)return;
        const span=Math.max(0,source.scrollWidth-source.clientWidth);
        const progress=span?source.scrollLeft/span:0;
        updating=true;
        for(const target of scrollers){
            if(target===source)continue;
            const next=progress*Math.max(0,target.scrollWidth-target.clientWidth);
            if(Math.abs(target.scrollLeft-next)>1)target.scrollLeft=next;
        }
        updating=false;
    },{passive:true}));
}

        lastDailyConsolidationRefresh=payload.generated_at||'';
        if(activeDaily==='daily_consolidation_first'||activeDaily==='stock_lookup')draw();
    }catch(_error){}
}
async function loadDailyConsolidationSessions(){
    try{
        let payload;
        if(location.protocol==='file:'){
            const encoded=await loadLocalDataScript('daily_consolidation_first_sessions_gzip');
            if(!encoded||typeof DecompressionStream!=='function')return;
            const binary=atob(encoded),bytes=new Uint8Array(binary.length);
            for(let index=0;index<binary.length;index++)bytes[index]=binary.charCodeAt(index);
            const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
            payload=JSON.parse(await new Response(stream).text());
        }else{
            const response=await fetch(`data/daily_consolidation_first_sessions.json?v=${Date.now()}`,{cache:'no-store'});
            if(!response.ok)return;
            payload=await response.json();
        }
        if(!payload||!Array.isArray(payload.sessions))return;
        dailyExtra.dailyConsolidationSessions=payload;
        delete dailyExtra.dailyConsolidationSessionsGzip;
        if(activeDaily==='daily_consolidation_first'||activeDaily==='stock_lookup')draw();
    }catch(_error){}
}
let shortCycleRefreshPromise=null,lastShortCycleFetchAt=0;
async function refreshShortCycleData(){
    if(location.protocol==='file:'||Date.now()-lastShortCycleFetchAt<300000)return;
    if(shortCycleRefreshPromise)return shortCycleRefreshPromise;
    lastShortCycleFetchAt=Date.now();
    const fetchLatest=async name=>{
        const path=`data/${name}?v=${Date.now()}`;
        const response=await fetch(path,{cache:'no-store'});
        return response.ok?response.json():null;
    };
    shortCycleRefreshPromise=(async()=>{try{
        const [minute,outcomes,alertRates]=await Promise.all([fetchLatest('weekly_short_cycle_latest.json'),fetchLatest('short_cycle_outcomes_latest.json'),fetchLatest('short_cycle_alert_win_rates.json')]);
        let changed=false;
        if(minute?.version==='weekly-short-cycle-v1'&&String(minute.generated_at||'')>String(lastShortCycleRefresh||'')){
            dailyExtra.weeklyShortCycle=minute;lastShortCycleRefresh=minute.generated_at;changed=true;
        }
        if(outcomes?.version==='short-cycle-appearance-outcomes-v1'&&String(outcomes.source_generated_at||'')>String(lastShortCycleOutcomeRefresh||'')){
            dailyExtra.shortCycleOutcomes=outcomes;lastShortCycleOutcomeRefresh=outcomes.source_generated_at;changed=true;
        }
        if(['short-cycle-alert-only-win-rates-v1','short-cycle-alert-only-win-rates-v2'].includes(alertRates?.version)&&String(alertRates.generated_at||'')>String(lastShortCycleAlertRateRefresh||'')){
            dailyExtra.shortCycleAlertRates=alertRates;lastShortCycleAlertRateRefresh=alertRates.generated_at;changed=true;
        }
        if(changed&&['daily_consolidation_first','two_centers','weekly_first','weekly_consolidation_first'].includes(activeDaily))draw();
    }catch(_error){}finally{shortCycleRefreshPromise=null}})();
    return shortCycleRefreshPromise;
}
if(location.protocol!=='file:'){
    refreshD2MonitorData();
    refreshD2HistoryData();
    refreshD2ReplayData();
    refreshD2ManualExclusions();
    setInterval(refreshD2MonitorData,60000);
