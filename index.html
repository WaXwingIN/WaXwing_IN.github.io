ght:700}.flat{color:#64748b}.gate{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.gate label{font-weight:700}.gate input{width:150px;padding:9px 10px;border:1px solid #ccd5e1;border-radius:8px}.gate button{padding:9px 16px;border:1px solid #2563eb;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}.gate span{color:#64748b}.model.featured{border:2px solid #f59e0b;box-shadow:0 10px 24px rgba(245,158,11,.14)}.model.featured .model-title h2{color:#b45309}.model-title{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}.model-title h2{margin:0;font-size:28px;line-height:1.2}.counts{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:#eef6ff;color:#1d4ed8;font-size:14px;font-weight:700}.badge.obs{background:#fff7ed;color:#c2410c}.badge.key{background:#fef3c7;color:#92400e;border:1px solid #f59e0b}.subhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;margin-bottom:8px;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc}.sub-title{display:flex;align-items:baseline;gap:8px}.subhead h3{margin:0;font-size:17px;line-height:1.2}.hint{color:#64748b;font-size:13px}.count-pill{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;background:#fff;color:#334155;border:1px solid #e2e8f0;font-size:13px;font-weight:700}.rules{color:#475569;line-height:1.8}.rules.locked{color:#94a3b8}.wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:9px 11px;border-bottom:1px solid #e5eaf0;text-align:right}th:nth-child(2),td:nth-child(2){text-align:left}th{background:#eef2f7}.sort-button{border:0;background:transparent;color:inherit;font:inherit;font-weight:700;cursor:pointer;padding:0}.sort-button.active{color:#2563eb}.sort-button:focus-visible{outline:2px solid #2563eb;outline-offset:4px}.hide{display:none}.meta{color:#64748b}@ </style></head><body><main><h1>日线模型选股</h1><div id="meta" class="meta"></div><section id="focusWatch" class="focus-watch" aria-label="下一交易日重点盯盘"></section><div class="review-bar"><button id="openPerformance" class="review-btn" type="button">历史命中复盘 <span id="performanceCount" class="review-count">0</span></button><span id="performanceBrief" class="review-brief">点击查看最近3个工作日</span></div><div id="performanceModal" class="modal hide" role="dialog" aria-modal="true" aria-labelledby="performanceTitle"><div class="modal-panel"><div class="modal-head"><h2 id="performanceTitle">历史命中复盘</h2><button id="closePerformance" class="modal-close" type="button" aria-label="关闭">×</button></div><div id="performance" class="modal-body"></div></div></div><div class="gate" id="ruleGate"><label for="rulePass">模型条件</label><input id="rulePass" type="password" inputmode="numeric" autocomplete="current-password" placeholder="输入口令"><button id="unlockRules" type="button">查看</button><span id="ruleMsg">条件已隐藏</span></div><div class="tabs"><button data-tab="focus" class="on">重点模型</button><button data-tab="strict">严格条件</button><button data-tab="long">中线</button></div><div id="content"></div><script>

function drawFocus(payload){
    const box=document.getElementById('focusWatch'),f=payload.focus_watchlist;
    if(!f){box.innerHTML='<h2>下一交易日重点盯盘</h2><p class="focus-note">本期尚未生成重点名单，等待下一次正式扫描。</p>';return}
    const preview=payload.is_intraday_preview||f.status==='preview';
    const price=value=>Number(value).toFixed(2);
    const cards=(f.picks||[]).map(p=>`<article class="focus-card"><h3>${esc(p['重点排名'])}. ${esc(p['名称'])} <small>${esc(p['代码'])}</small></h3>${rulesUnlocked?`<span class="badge">${esc(p['模型'])} · 原排名 ${esc(p['原排名'])}${p['历史近邻Top3']&&p['历史近邻Top3']['可排序']?' · 近邻投票'+esc(p['历史近邻Top3']['近邻综合分']):p['形态相似度']!==null&&p['形态相似度']!==undefined?' · 形态'+esc(p['形态相似度']):''}${p['缩量蓄势匹配']?' · 缩量蓄势5/5':''}${p['20日强趋势匹配']?' · 强趋势再加速5/5':''}</span><ul>${p['入选依据'].map(r=>`<li>${esc(r)}</li>`).join('')}</ul><p class="focus-level"><strong>转强观察：</strong>站上信号日高点 ${price(p['信号高点'])} 后，观察回踩能否守住。</p><p><strong>均线参照：</strong>${esc(p['均线'])} ${price(p['均线值'])}，${p['检查']['收在均线上']?'失守则降低优先级':'目前尚未站回，先等待修复'}；跌破信号日低点 ${price(p['信号低点'])} 取消本轮观察。</p>`:'<p class="focus-note">选股依据已隐藏，输入口令后查看。</p>'}</article>`).join('');
    const votePicks=(f.ma10_neighbor_watch||[]).filter(p=>p['历史近邻Top3']&&p['历史近邻Top3']['可排序']);
    const voteTable=rulesUnlocked&&votePicks.length?`<div class="focus-vote-table"><h3>10日线Top3近邻投票对照</h3><p class="focus-note">独立展示10日线组内前三，不改变上方最终重点名单。</p><table><thead><tr><th>当前票</th><th>Top3历史样本</th><th>次日上涨率</th><th>次日涨停率</th><th>最大回撤</th></tr></thead><tbody>${votePicks.map(p=>{const v=p['历史近邻Top3'],names=v['历史样本'].map(s=>`${esc(s['名称'])} ${Number(s['次日涨跌幅%'])>=0?'+':''}${esc(s['次日涨跌幅%'])}%`).join(' / ');return `<tr><td>${esc(p['近邻排名'])}. ${esc(p['名称'])}</td><td>${names}</td><td>${esc(v['次日上涨率%'])}%</td><td>${esc(v['次日涨停率%'])}%</td><td>${esc(v['次日盘中最大回撤%'])}%</td></tr>`}).join('')}</tbody></table></div>`:'';
    const replay=payload.report_type==='rule_replay';
    box.innerHTML=`<div class="focus-heading"><h2>${replay?'规则重算观察（非盘前预测）':preview?'午盘重点观察':'下一交易日重点盯盘'}</h2><span class="badge">${replay?'重算对照 · 不计复盘':preview?'非最终 · 不计复盘':'试行 · 待验证'} ${f.picks.length}只</span></div><p class="focus-note">信号日 ${pageDate(f.selection_date)}。${preview?'仅午盘临时参考，收盘重新筛选。':'以下价格为信号日收盘后的观察参照，不是实时行情。'}</p>${cards?`<div class="focus-grid">${cards}</div>`:'<p>暂无具备完整同日行情的候选，本期留空。</p>'}${voteTable}${rulesUnlocked?`<details><summary>筛选依据与验证说明</summary><p>${esc(f.rules)}</p><p>规则版本：${esc(f.version)}；名单记录时间：${pageDateTime(f.recorded_at)}。只对事前保存的重点名单做次日复盘，未记录的历史不事后补选。</p></details>`:''}<p class="focus-note">观察名单不等于买入指令；需等待次日确认，跳空高开不等于合适买点。复盘涨幅是收盘到收盘表现，不是可实现交易收益。</p>`;
}
function focusReview(session,model){
    const review=session['重点盯盘'];
    if(!review)return '<p class="focus-note">本期尚未记录重点名单，不事后回填。</p>';
    const allRows=[...(review.rows||[])].sort((a,b)=>a['重点排名']-b['重点排名']);
    if(!allRows.length)return '<p class="focus-note">本期重点名单没有可结算行情。</p>';
    const rows=allRows.filter(r=>r['模型']===model),q=performanceSummary(allRows);
    const location=rows.length?`当前${esc(model)}表内有${rows.length}只，已在原排名行标星。`:`当前${esc(model)}表内没有；请切换另一模型Tab查看星标位置。`;
    return `<div class="focus-review"><strong>当时额外精选（跨模型）</strong> · ${esc(review.version)}<br>${allRows.map(r=>`${esc(r['重点排名'])}. ${esc(r['名称'])}（${esc(r['模型'])}原排名${esc(r['排名'])}）：${performancePercent(r['次日涨跌幅%'])}`).join('；')}<br>3只整体上涨率 ${performancePercent(q.upRate)} · 平均 ${performancePercent(q.average)}。${location}仅对比收盘表现，不代表交易收益。</div>`;
}

const esc=s=>String(s??'-').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pageDate=value=>{const digits=String(value??'').replace(/\D/g,'');return digits.length>=8?`${digits.slice(0,4)}/${digits.slice(4,6)}/${digits.slice(6,8)}`:'--'};
const pageDateTime=value=>{const text=String(value??''),date=pageDate(text),match=text.match(/(?:T|\s)(\d{2}:\d{2}:\d{2})/);return date==='--'?'--':date+(match?' '+match[1]:'')};
const tableSorts=new Map();
function toggleTableSort(id,key){let current=tableSorts.get(id);tableSorts.set(id,{key,direction:current&&current.key===key?-current.direction:(key==='排名'?1:-1)});draw()}
function table(rows,emptyText='暂无股票。',id=''){
if(!rows.length)return `<p>${esc(emptyText)}</p>`;
let ks=Object.keys(rows[0]).filter(k=>k!=='选股依据');if(!rulesUnlocked){const publicKeys=new Set(['排名','代码','名称','股票','选股收盘','次日收盘','次日涨跌幅%','结果','次日涨跌结果','3日收益','5日收益']);ks=ks.filter(k=>publicKeys.has(k))}if(ks.includes('次日涨跌幅%')&&ks.includes('结果'))ks=ks.filter(k=>k!=='结果').map(k=>k==='次日涨跌幅%'?'次日涨跌结果':k);if(ks.includes('排名'))ks=['排名',...ks.filter(k=>k!=='排名')];
let sortable=id&&ks.includes('排名'),sort=sortable?(tableSorts.get(id)||{key:'排名',direction:1}):null;
let displayed=[...rows];if(sort)displayed.sort((a,b)=>{let av=a[sort.key],bv=b[sort.key],am=av==null||av===''||!Number.isFinite(Number(av)),bm=bv==null||bv===''||!Number.isFinite(Number(bv));return am||bm?(am===bm?0:am?1:-1):(Number(av)-Number(bv))*sort.direction});
const formatValue=value=>value&&typeof value==='object'?Object.entries(value).map(([key,item])=>`${key}：${item}`).join('；'):value;
const dateText=value=>{const raw=String(value??'');const m=raw.match(/^(\d{4})-?(\d{2})-?(\d{2})(.*)$/);if(!m)return raw;const time=m[4].trim().replace(/^T/,' ');return `${m[1]}/${m[2]}/${m[3]}${time?time:''}`};
const cell=(key,value,row)=>{if(key==='次日涨跌结果'){const number=Number(row['次日涨跌幅%']),up=number>0,down=number<0;return `<td class="${up?'pos':down?'neg':'flat'}">${up?'▲':down?'▼':'•'} ${Number.isFinite(number)?`${up?'+':''}${number.toFixed(2)}%`: '—'} ${esc(row['结果']||'')}</td>`}let number=Number(value),signed=key==='距涨停日开盘价%'&&value!==null&&value!==''&&Number.isFinite(number),shown=signed&&number>0?`+${value}`:formatValue(value),isDate=/(日期|时间|日期日|生成时间|快照日|选股日|结果日|最近涨停日|首次回踩日)/.test(key)&&typeof shown==='string';if(isDate)shown=dateText(shown);const cls=signed?(number>0?'pos':(number<0?'neg':'flat')):'';return `<td${cls?` class="${cls}"`:''}>${esc(shown)}</td>`};
return '<div class="wrap"><table><thead><tr>'+ks.map(k=>{let canSort=sortable&&['排名','复涨特征分'].includes(k),active=sort&&sort.key===k;return `<th${canSort?` aria-sort="${active?(sort.direction===1?'ascending':'descending'):'none'}"`:''}>${canSort?`<button type="button" class="sort-button${active?' active':''}" data-sort-table="${esc(id)}" data-sort-key="${esc(k)}">${esc(k)} ${active?(sort.direction===1?'↑':'↓'):'↕'}</button>`:esc(k)}</th>`}).join('')+'</tr></thead><tbody>'+displayed.map(r=>'<tr>'+ks.map(k=>cell(k,r[k],r)).join('')+'</tr>').join('')+'</tbody></table></div>'}

const RULE_HASH='aee73035ea60b04c339e9363202e5c4c1aac91fa8a0d55c8487fbcf51a1c2ef2';
let data,tab='focus',rulesUnlocked=sessionStorage.getItem('rulesUnlocked')==='1';
async function sha256(text){let buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function syncGate(){document.getElementById('ruleMsg').textContent=rulesUnlocked?'条件已解锁':'条件已隐藏'}
const performanceModels=['首踩10日线','首踩20日线'];
let performanceModel=performanceModels[0],performanceData=null;
let performanceDate=null;
const performancePanel=document.getElementById('performance');
const performanceTabs=document.createElement('div');
performanceTabs.className='review-tabs';
performanceTabs.setAttribute('role','tablist');
performanceTabs.setAttribute('aria-label','复盘模型');
performanceTabs.innerHTML=performanceModels.map((name,i)=>`<button type="button" role="tab" id="performance-tab-${i}" aria-controls="performance" aria-selected="${i===0}" tabindex="${i===0?0:-1}" data-review-model="${name}">${name}</button>`).join('');
performancePanel.before(performanceTabs);
performancePanel.setAttribute('role','tabpanel');
performancePanel.setAttribute('aria-labelledby','performance-tab-0');
performancePanel.setAttribute('tabindex','0');
function selectPerformanceModel(name){
    if(!performanceModels.includes(name))return;
    performanceModel=name;
    drawPerformance(performanceData);
    performancePanel.scrollTop=0;
    performanceTabs.querySelector('[aria-selected="true"]').focus();
}
performanceTabs.addEventListener('click',event=>{
    const button=event.target.closest('button[data-review-model]');
    if(button)selectPerformanceModel(button.dataset.reviewModel);
});
performanceTabs.addEventListener('keydown',event=>{
    if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
    event.preventDefault();
    const index=performanceModels.indexOf(performanceModel);
    const next=event.key==='Home'?0:event.key==='End'?performanceModels.length-1:
        (index+(event.key==='ArrowRight'?1:-1)+performanceModels.length)%performanceModels.length;
    selectPerformanceModel(performanceModels[next]);
});
performancePanel.addEventListener('click',event=>{
    const button=event.target.closest('button[data-review-date]');
    if(button){performanceDate=button.dataset.reviewDate;drawPerformance(performanceData)}
});
performancePanel.addEventListener('keydown',event=>{
    const button=event.target.closest('button[data-review-date]');
    if(!button||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
    event.preventDefault();
    const buttons=[...performancePanel.querySelectorAll('button[data-review-date]')],index=buttons.indexOf(button);
    const next=event.key==='Home'?0:event.key==='End'?buttons.length-1:
        (index+(event.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;
    buttons[next].click();buttons[next].focus();
});
function performanceSummary(rows){
    const valid=rows.filter(r=>r['次日涨跌幅%']!=null&&r['次日涨跌幅%']!==''&&Number.isFinite(Number(r['次日涨跌幅%'])));
    const changes=valid.map(r=>Number(r['次日涨跌幅%']));
    const up=changes.filter(value=>value>0).length;
    return {
        total:rows.length,valid:valid.length,up,
        down:changes.filter(value=>value<0).length,
        limitUp:valid.filter(r=>r['结果']==='涨停').length,
        upRate:valid.length?(up/valid.length*100).toFixed(1):null,
        average:valid.length?(changes.reduce((sum,value)=>sum+value,0)/valid.length).toFixed(2):null
    };
}
const performancePercent=value=>value==null?'—':`${value}%`;
function performanceTable(rows,review=null){
    if(!rows.length)return `<p>当日无${esc(performanceModel)}正式入选股票。</p>`;
    const focusRanks=new Map((review?.rows||[]).map(row=>[`${row['模型']}|${row['代码']}`,row['重点排名']]));
    const keys=['排名','代码','名称','选股收盘','次日收盘','次日涨跌结果','额外精选'];
    return '<div class="wrap"><table><thead><tr>'+keys.map(key=>`<th>${key==='排名'?'选股时排名':esc(key)}</th>`).join('')+

    html+=`<div class="stage-flow"><span>昨夜候选 ${safe(overnight)}</span><i>→</i><span>09:20预判</span><i>→</i><span>09:24:50二筛 ${safe(auctionCount)}</span><i>→</i><span>09:32开盘确认</span><i>→</i><span class="stage-pass">09:38可买 ${safe(finalRows.length)}</span></div>`;

    html+=state.date==='latest'?`<p class="daily-note"><strong>历史规则重算：</strong>${safe(replay['复盘期数'])}期，最终样本${safe(replay['最终样本'])}只，收盘盈利率${safe(replay['收盘盈利率%'])}%，平均收盘${pct(replay['平均收盘收益%'])}，平均最高${pct(replay['平均最高收益%'])}，平均回撤${pct(replay['平均最大回撤%'])}。这不是当时冻结的盘前预测。</p>`:`<p class="daily-note"><strong>本日复盘：</strong>行情有效 ${safe(summary['行情有效'])}/${safe(summary['昨夜候选'])}，最终${safe(summary['最终可买'])}只，收盘盈利率${safe(summary['收盘盈利率%'])}%，平均收盘${pct(summary['平均收盘收益%'])}，平均最高${pct(summary['平均最高收益%'])}，平均回撤${pct(summary['平均最大回撤%'])}。历史分钟数据缺失的股票不补算。</p>`;
    if(rulesUnlocked)html+=`<details class="daily-rules"><summary>模型范围与执行口径</summary><p>${safe(payload.rules)}</p><p>${safe(payload.warning)}</p></details>`;else html+='<p class="daily-note">选股依据已隐藏，输入口令后查看。</p>';
    html+='<h3 class="final-list-title">优先可买名单（最多3只）</h3><div class="wrap"><table><thead><tr><th>排名</th><th>股票</th><th>状态</th><th>收盘/当前收益</th><th>日线潜力分</th><th>实时可交易分</th><th>竞价</th><th>确认价</th><th>原因</th>'+(rulesUnlocked?'<th>模型来源</th>':'')+'</tr></thead><tbody>';
    html+=finalRows.map(row=>`<tr class="focus-history-row"><td>${safe(row['最终排名'])}</td><td><b>${safe(row['名称'])}</b><br>${safe(row['代码'])}</td><td>${safe(row['实时状态']??'BUY')}</td><td>${pct(row['确认后当前收益%']??row['当日收益%'])}</td><td>${safe(row['日线潜力分']??row['昨夜评分'])}</td><td>${safe(row['实时可交易分'])}</td><td>${pct(row['竞价幅度%'])}</td><td>${safe(row['确认价'])}</td><td>${safe(row['状态原因'])}</td>${rulesUnlocked?`<td>${(row['模型来源']||[]).map(safe).join('<br>')}</td>`:''}</tr>`).join('')||`<tr><td colspan="${rulesUnlocked?10:9}">当前没有触发BUY的股票；空名单也是有效结果。</td></tr>`;
    html+='</tbody></table></div><details class="daily-rules"><summary>查看全部昨夜候选（'+rows.length+'只，竞价通过'+auction.length+'只）</summary><div class="wrap"><table><thead><tr><th>股票</th><th>收盘/当前收益</th><th>状态</th><th>日线潜力分</th><th>实时可交易分</th><th>竞价</th><th>VWAP偏离</th><th>触发条件/原因</th>'+(rulesUnlocked?'<th>模型来源</th>':'')+'</tr></thead><tbody>';
    html+=rows.map(row=>`<tr><td><b>${safe(row['名称'])}</b><br>${safe(row['代码'])}</td><td>${pct(row['当日收益%'])}</td><td>${safe(row['实时状态']??'WAIT')}</td><td>${safe(row['日线潜力分']??row['昨夜评分'])}</td><td>${safe(row['实时可交易分'])}</td><td>${pct(row['竞价幅度%'])}</td><td>${pct(row['VWAP偏离%'])}</td><td>${safe(row['状态原因']??row['触发条件']??'--')}</td>${rulesUnlocked?`<td>${(row['模型来源']||[]).map(safe).join('<br>')}</td>`:''}</tr>`).join('')||`<tr><td colspan="${rulesUnlocked?9:8}">暂无昨夜候选。</td></tr>`;
    return html+'</tbody></table></div></details>';
}
draw=function(){
    if(!data)return;
    stickyControls.querySelector('.daily-filters')?.remove();
    const id=activeDaily,state=stateFor(id),content=document.getElementById('content');
    const isMA=id==='ma10'||id==='ma20';
    if(isMA){
        tab='focus';oldDraw();
        content.querySelectorAll('.model').forEach(section=>{if(section.querySelector('h2')?.textContent!==modelName(id))section.remove()});
        const sessions=(performanceData?.history||[]).map(s=>({...s,date:s['选股日'],kind:'已结算'}));
        const bar=filterBar(state,[{date:data.date,kind:'当前行情'} ,...sessions]);
        if(state.date!=='latest'){
            const session=sessions.find(s=>s.date===state.date),rows=(session?.rows||[]).filter(r=>r['模型']===modelName(id));
            content.innerHTML=`<h2>${modelName(id)} · 历史记录</h2><p class="daily-note">选股日 ${safe(state.date)} · 结果日 ${safe(session?.['结果日'])}</p>${table(rows,'当日无正式入选股票。')}`;
        }
        content.insertAdjacentHTML('afterbegin',bar);
    }else if(id==='strict'||id==='long'){tab=id;oldDraw()}
    else if(id==='compound'){content.innerHTML=compoundPanel(state)}
    else if(id==='marketTrade'){content.innerHTML=marketTradePanel(state)}
    else{content.innerHTML=patternPanel(id,state)}
    const focus=document.getElementById('focusWatch');if(focus)focus.hidden=!isMA||state.date!=='latest';
    document.getElementById('ruleGate').hidden=false;
    dailyNav.innerHTML=primaryDailyModels.map(([key,label])=>`<button type="button" id="daily-${key}" role="tab" data-daily="${key}" aria-controls="content" aria-selected="${key===id}" tabindex="${key===id?0:-1}">${label}</button>`).join('')+`<details class="experimental-models"><summary>试验模型 ▾</summary><div class="experimental-options">${dailyModels.filter(([key])=>experimentalKeys.includes(key)).map(([key,label])=>`<button type="button" id="daily-${key}" role="tab" data-daily="${key}" aria-controls="content" aria-selected="${key===id}" tabindex="${key===id?0:-1}">${label}</button>`).join('')}</div></details>`;
    content.setAttribute('role','tabpanel');content.setAttribute('tabindex','0');
    if(dailyModels.some(x=>x[0]===id))content.setAttribute('aria-labelledby','daily-'+id);else content.removeAttribute('aria-labelledby');
    const date=document.getElementById('dailyDate');if(date){stickyControls.append(date.closest('.daily-filters'));date.onchange=()=>{state.date=date.value;draw()}};
    const ref=document.getElementById('dailyReference');if(ref)ref.onchange=()=>{state.reference=ref.value;state.date='latest';draw()};
    content.querySelectorAll('[data-pattern-sort]').forEach(button=>button.onclick=()=>{const key=button.dataset.patternSort;state.sortDirection=state.sortKey===key?-state.sortDirection:(key==='rank'?1:-1);state.sortKey=key;draw()});
};
if(data)draw();
</script></body></html>
