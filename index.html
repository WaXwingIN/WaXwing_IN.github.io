</style></head><body><main><h1>日线模型选股</h1><div id="meta" class="meta"></div><section id="focusWatch" class="focus-watch" aria-label="下一交易日重点盯盘"></section><div class="review-bar"><button id="openPerformance" class="review-btn" type="button">历史命中复盘 <span id="performanceCount" class="review-count">0</span></button><span id="performanceBrief" class="review-brief">点击查看最近3个工作日</span></div><div id="performanceModal" class="modal hide" role="dialog" aria-modal="true" aria-labelledby="performanceTitle"><div class="modal-panel"><div class="modal-head"><h2 id="performanceTitle">历史命中复盘</h2><button id="closePerformance" class="modal-close" type="button" aria-label="关闭">×</button></div><div id="performance" class="modal-body"></div></div></div><div class="gate" id="ruleGate"><label for="rulePass">模型条件</label><input id="rulePass" type="password" inputmode="numeric" autocomplete="current-password" placeholder="输入口令"><button id="unlockRules" type="button">查看</button><span id="ruleMsg">条件已隐藏</span></div><div class="tabs"><button data-tab="focus" class="on">重点模型</button><button data-tab="strict">严格条件</button><button data-tab="long">中线</button></div><div id="content"></div><script>

function drawFocus(payload){
    const box=document.getElementById('focusWatch'),f=payload.focus_watchlist;
    if(!f){box.innerHTML='<h2>下一交易日重点盯盘</h2><p class="focus-note">本期尚未生成重点名单，等待下一次正式扫描。</p>';return}
    const preview=payload.is_intraday_preview||f.status==='preview';
    const price=value=>Number(value).toFixed(2);
    const cards=(f.picks||[]).map(p=>`<article class="focus-card"><h3>${esc(p['重点排名'])}. ${esc(p['名称'])} <small>${esc(p['代码'])}</small></h3><span class="badge">${esc(p['模型'])} · 原排名 ${esc(p['原排名'])}${p['历史近邻Top3']&&p['历史近邻Top3']['可排序']?' · 近邻投票'+esc(p['历史近邻Top3']['近邻综合分']):p['形态相似度']!==null&&p['形态相似度']!==undefined?' · 形态'+esc(p['形态相似度']):''}${p['缩量蓄势匹配']?' · 缩量蓄势5/5':''}${p['20日强趋势匹配']?' · 强趋势再加速5/5':''}</span><ul>${p['入选依据'].map(r=>`<li>${esc(r)}</li>`).join('')}</ul><p class="focus-level"><strong>转强观察：</strong>站上信号日高点 ${price(p['信号高点'])} 后，观察回踩能否守住。</p><p><strong>均线参照：</strong>${esc(p['均线'])} ${price(p['均线值'])}，${p['检查']['收在均线上']?'失守则降低优先级':'目前尚未站回，先等待修复'}；跌破信号日低点 ${price(p['信号低点'])} 取消本轮观察。</p></article>`).join('');
    const votePicks=(f.ma10_neighbor_watch||[]).filter(p=>p['历史近邻Top3']&&p['历史近邻Top3']['可排序']);
    const voteTable=votePicks.length?`<div class="focus-vote-table"><h3>10日线Top3近邻投票对照</h3><p class="focus-note">独立展示10日线组内前三，不改变上方最终重点名单。</p><table><thead><tr><th>当前票</th><th>Top3历史样本</th><th>次日上涨率</th><th>次日涨停率</th><th>最大回撤</th></tr></thead><tbody>${votePicks.map(p=>{const v=p['历史近邻Top3'],names=v['历史样本'].map(s=>`${esc(s['名称'])} ${Number(s['次日涨跌幅%'])>=0?'+':''}${esc(s['次日涨跌幅%'])}%`).join(' / ');return `<tr><td>${esc(p['近邻排名'])}. ${esc(p['名称'])}</td><td>${names}</td><td>${esc(v['次日上涨率%'])}%</td><td>${esc(v['次日涨停率%'])}%</td><td>${esc(v['次日盘中最大回撤%'])}%</td></tr>`}).join('')}</tbody></table></div>`:'';
    const replay=payload.report_type==='rule_replay';
    box.innerHTML=`<div class="focus-heading"><h2>${replay?'规则重算观察（非盘前预测）':preview?'午盘重点观察':'下一交易日重点盯盘'}</h2><span class="badge">${replay?'重算对照 · 不计复盘':preview?'非最终 · 不计复盘':'试行 · 待验证'} ${f.picks.length}只</span></div><p class="focus-note">信号日 ${esc(f.selection_date)} · 从${f.candidate_count}只原候选中另选最多3只，独立挑选不改变模型列表及排名。${preview?'仅午盘临时参考，收盘重新筛选。':'以下价格为信号日收盘后的观察参照，不是实时行情。'}</p>${cards?`<div class="focus-grid">${cards}</div>`:'<p>暂无具备完整同日行情的候选，本期留空。</p>'}${voteTable}<details><summary>筛选依据与验证说明</summary><p>${esc(f.rules)}</p><p>规则版本：${esc(f.version)}；名单记录时间：${esc(f.recorded_at)}。只对事前保存的重点名单做次日复盘，未记录的历史不事后补选。</p></details><p class="focus-note">观察名单不等于买入指令；需等待次日确认，跳空高开不等于合适买点。复盘涨幅是收盘到收盘表现，不是可实现交易收益。</p>`;
}
function focusReview(session,model){
    const review=session['重点盯盘'];
    if(!review)return '<p class="focus-note">本期尚未记录重点名单，不事后回填。</p>';
    const allRows=[...(review.rows||[])].sort((a,b)=>a['重点排名']-b['重点排名']);
    if(!allRows.length)return '<p class="focus-note">本期重点名单没有可结算行情。</p>';
    const rows=allRows.filter(r=>r['模型']===model),q=performanceSummary(allRows);
    const location=rows.length?`当前${esc(model)}表内有${rows.length}只，已在原排名行标星。`:`当前${esc(model)}表内没有；请切换另一模型Tab查看星标位置。`;
    return `<div class="focus-review"><strong>当时额外精选（跨模型）</strong> · ${esc(review.version)}<br>${allRows.map(r=>`${esc(r['重点排名'])}. ${esc(r['名称'])}（${esc(r['模型'])}原排名${esc(r['排名'])}）：${performancePercent(r['次日涨跌幅%'])}`).join('；')}<br>3只整体上涨率 ${performancePercent(q.upRate)} · 平均 ${performancePercent(q.average)}。${location}仅对比收盘表现，不代表交易收益。</div>`;
}

const esc=s=>String(s??'-').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const tableSorts=new Map();
function toggleTableSort(id,key){let current=tableSorts.get(id);tableSorts.set(id,{key,direction:current&&current.key===key?-current.direction:(key==='排名'?1:-1)});draw()}
function table(rows,emptyText='暂无股票。',id=''){
if(!rows.length)return `<p>${esc(emptyText)}</p>`;
let ks=Object.keys(rows[0]).filter(k=>k!=='选股依据');if(ks.includes('次日涨跌幅%')&&ks.includes('结果'))ks=ks.filter(k=>k!=='结果').map(k=>k==='次日涨跌幅%'?'次日涨跌结果':k);if(ks.includes('排名'))ks=['排名',...ks.filter(k=>k!=='排名')];
let sortable=id&&ks.includes('排名'),sort=sortable?(tableSorts.get(id)||{key:'排名',direction:1}):null;
let displayed=[...rows];if(sort)displayed.sort((a,b)=>{let av=a[sort.key],bv=b[sort.key],am=av==null||av===''||!Number.isFinite(Number(av)),bm=bv==null||bv===''||!Number.isFinite(Number(bv));return am||bm?(am===bm?0:am?1:-1):(Number(av)-Number(bv))*sort.direction});
const formatValue=value=>value&&typeof value==='object'?Object.entries(value).map(([key,item])=>`${key}：${item}`).join('；'):value;
const dateText=value=>{const raw=String(value??'');const m=raw.match(/^(\d{4})-?(\d{2})-?(\d{2})(.*)$/);if(!m)return raw;const time=m[4].trim().replace(/^T/,' ');return `${m[1]}/${m[2]}/${m[3]}${time?time:''}`};
const cell=(key,value,row)=>{if(key==='次日涨跌结果'){const number=Number(row['次日涨跌幅%']),up=number>0,down=number<0;return `<td class="${up?'pos':down?'neg':'flat'}">${up?'▲':down?'▼':'•'} ${Number.isFinite(number)?`${up?'+':''}${number.toFixed(2)}%`: '—'} ${esc(row['结果']||'')}</td>`}let number=Number(value),signed=key==='距涨停日开盘价%'&&value!==null&&value!==''&&Number.isFinite(number),shown=signed&&number>0?`+${value}`:formatValue(value),isDate=/(日期|时间|日期日|生成时间|快照日|选股日|结果日|最近涨停日|首次回踩日)/.test(key)&&typeof shown==='string';if(isDate)shown=dateText(shown);const cls=signed?(number>0?'pos':(number<0?'neg':'flat')):'';return `<td${cls?` class="${cls}"`:''}>${esc(shown)}</td>`};
return '<div class="wrap"><table><thead><tr>'+ks.map(k=>{let canSort=sortable&&['排名','复涨特征分'].includes(k),active=sort&&sort.key===k;return `<th${canSort?` aria-sort="${active?(sort.direction===1?'ascending':'descending'):'none'}"`:''}>${canSort?`<button type="button" class="sort-button${active?' active':''}" data-sort-table="${esc(id)}" data-sort-key="${esc(k)}">${esc(k)} ${active?(sort.direction===1?'↑':'↓'):'↕'}</button>`:esc(k)}</th>`}).join('')+'</tr></thead><tbody>'+displayed.map(r=>'<tr>'+ks.map(k=>cell(k,r[k],r)).join('')+'</tr>').join('')+'</tbody></table></div>'}

const RULE_HASH='aee73035ea60b04c339e9363202e5c4c1aac91fa8a0d55c8487fbcf51a1c2ef2';
let data,tab='focus',rulesUnlocked=sessionStorage.getItem('rulesUnlocked')==='1';
async function sha256(text){let buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function syncGate(){document.getElementById('ruleMsg').textContent=rulesUnlocked?'条件已解锁':'条件已隐藏'}
const performanceModels=['首踩10日线','首踩20日线'];
let performanceModel=performanceModels[0],performanceData=null;
let performanceDate=null;
const performancePanel=document.getElementById('performance');
const performanceTabs=document.createElement('div');
performanceTabs.className='review-tabs';
performanceTabs.setAttribute('role','tablist');
performanceTabs.setAttribute('aria-label','复盘模型');
performanceTabs.innerHTML=performanceModels.map((name,i)=>`<button type="button" role="tab" id="performance-tab-${i}" aria-controls="performance" aria-selected="${i===0}" tabindex="${i===0?0:-1}" data-review-model="${name}">${name}</button>`).join('');
performancePanel.before(performanceTabs);
performancePanel.setAttribute('role','tabpanel');
performancePanel.setAttribute('aria-labelledby','performance-tab-0');
performancePanel.setAttribute('tabindex','0');
function selectPerformanceModel(name){
    if(!performanceModels.includes(name))return;
    performanceModel=name;
    drawPerformance(performanceData);
    performancePanel.scrollTop=0;
    performanceTabs.querySelector('[aria-selected="true"]').focus();
}
performanceTabs.addEventListener('click',event=>{
    const button=event.target.closest('button[data-review-model]');
    if(button)selectPerformanceModel(button.dataset.reviewModel);
});
performanceTabs.addEventListener('keydown',event=>{
    if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
    event.preventDefault();
    const index=performanceModels.indexOf(performanceModel);
    const next=event.key==='Home'?0:event.key==='End'?performanceModels.length-1:
        (index+(event.key==='ArrowRight'?1:-1)+performanceModels.length)%performanceModels.length;
    selectPerformanceModel(performanceModels[next]);
});
performancePanel.addEventListener('click',event=>{
    const button=event.target.closest('button[data-review-date]');
    if(button){performanceDate=button.dataset.reviewDate;drawPerformance(performanceData)}
});
performancePanel.addEventListener('keydown',event=>{
    const button=event.target.closest('button[data-review-date]');
    if(!button||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
    event.preventDefault();
    const buttons=[...performancePanel.querySelectorAll('button[data-review-date]')],index=buttons.indexOf(button);
    const next=event.key==='Home'?0:event.key==='End'?buttons.length-1:
        (index+(event.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;
    buttons[next].click();buttons[next].focus();
});
function performanceSummary(rows){
    const valid=rows.filter(r=>r['次日涨跌幅%']!=null&&r['次日涨跌幅%']!==''&&Number.isFinite(Number(r['次日涨跌幅%'])));
    const changes=valid.map(r=>Number(r['次日涨跌幅%']));
    const up=changes.filter(value=>value>0).length;
    return {
        total:rows.length,valid:valid.length,up,
        down:changes.filter(value=>value<0).length,
        limitUp:valid.filter(r=>r['结果']==='涨停').length,
        upRate:valid.length?(up/valid.length*100).toFixed(1):null,
        average:valid.length?(changes.reduce((sum,value)=>sum+value,0)/valid.length).toFixed(2):null
    };
}
const performancePercent=value=>value==null?'—':`${value}%`;
function performanceTable(rows,review=null){
    if(!rows.length)return `<p>当日无${esc(performanceModel)}正式入选股票。</p>`;
    const focusRanks=new Map((review?.rows||[]).map(row=>[`${row['模型']}|${row['代码']}`,row['重点排名']]));
    const keys=['排名','代码','名称','选股收盘','次日收盘','次日涨跌结果','额外精选'];
    return '<div class="wrap"><table><thead><tr>'+keys.map(key=>`<th>${key==='排名'?'选股时排名':esc(key)}</th>`).join('')+
        '</tr></thead><tbody>'+rows.map(row=>{const focusRank=focusRanks.get(`${row['模型']}|${row['代码']}`);return `<tr${focusRank!=null?' class="focus-history-row"':''}>`+keys.map(key=>{
            if(key==='额外精选')return '<td>'+(focusRank!=null?'<span class="focus-history-badge">★ 第'+esc(focusRank)+'</span>':'—')+'</td>';
            if(key==='次日涨跌结果'){const value=Number(row['次日涨跌幅%']),up=value>0,down=value<0;const cls=up?'pos':down?'neg':'flat';const arrow=up?'▲':down?'▼':'•';const percent=Number.isFinite(value)?`${up?'+':''}${value.toFixed(2)}%`:'—';return `<td class="${cls}"><span class="result-arrow">${arrow} ${percent} ${esc(row['结果']||'')}</span></td>`;}
            const value=row[key];
            return `<td>${esc(value)}</td>`;
        }).join('')+'</tr>'}).join('')+'</tbody></table></div>';
}
function drawPerformance(perf){
    performanceData=perf;
    const history=(perf&&perf.history||[]).slice(0,3);
    const count=document.getElementById('performanceCount'),brief=document.getElementById('performanceBrief');
    performanceTabs.querySelectorAll('button').forEach((button,i)=>{
        const selected=button.dataset.reviewModel===performanceModel;

style.textContent+='[hidden]{display:none!important}.experimental-models{position:relative}.experimental-models summary{list-style:none;cursor:pointer;padding:6px 12px;border:1px solid #ccd5e1;border-radius:8px;background:#fff;font-size:14px}.experimental-models summary::-webkit-details-marker{display:none}.experimental-options{position:absolute;top:calc(100% + 4px);right:0;z-index:30;display:flex;gap:6px;padding:7px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.14)}.experimental-options button{white-space:nowrap}.daily-sticky-controls{position:sticky;top:0;z-index:20;background:#f6f8fb;border-bottom:1px solid #cbd5e1}.daily-tabs{position:static;background:transparent;padding:5px 0;border-bottom:0;margin-bottom:0}.daily-tabs button{min-height:34px;padding:6px 12px;font-size:14px}.daily-more{margin:0;padding:2px 0;font-size:13px}.daily-filters{margin:0;padding:5px 0;border-top:1px solid #e2e8f0}.daily-filters select{padding:5px;font-size:14px}';
dailyNav.classList.add('daily-tabs');
dailyNav.setAttribute('role','tablist');
dailyNav.setAttribute('aria-label','日线模型');
const more=document.createElement('div');
more.className='daily-more';
more.innerHTML='<button type="button" data-extra="strict">其他周期：严格条件 T+1 / T1-T5</button><button type="button" data-extra="long">中线</button>';
document.getElementById('meta').after(dailyNav);
dailyNav.after(more);

stickyControls.className='daily-sticky-controls';

more.onclick=e=>{const b=e.target.closest('[data-extra]');if(b){activeDaily=b.dataset.extra;draw()}};
function selectDaily(id){activeDaily=id;draw();document.getElementById('daily-'+id)?.focus()}
dailyNav.onclick=e=>{const b=e.target.closest('[data-daily]');if(b)selectDaily(b.dataset.daily)};
dailyNav.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();let i=dailyModels.findIndex(x=>x[0]===activeDaily),n=dailyModels.length;i=e.key==='Home'?0:e.key==='End'?n-1:(i+(e.key==='ArrowRight'?1:-1)+n)%n;selectDaily(dailyModels[i][0])};
function dailyChart(path=[],ref=[]){
    const values=[...path,...ref].filter(Number.isFinite);
    if(!values.length)return '';
    const lo=Math.min(...values)-1,hi=Math.max(...values)+1;
    const points=a=>a.map((v,i)=>`${5+i*210/Math.max(1,a.length-1)},${79-(v-lo)/(hi-lo)*74}`).join(' ');
    return `<svg class="daily-plot" viewBox="0 0 220 84" role="img" aria-label="蓝色候选与橙色参考股收盘走势"><polyline points="${points(ref)}" fill="none" stroke="#e09521" stroke-width="2"/><polyline points="${points(path)}" fill="none" stroke="#2563eb" stroke-width="2"/></svg>`;
}
function dailyReturn(row,n){const r=row.returns?.[n];return !r||r.value==null?'--':`<span class="${r.value>0?'pos':r.value<0?'neg':'flat'}" style="${r.value===0?'font-weight:700;':''}" title="${safe(r.date)}">${r.value>0?'+':''}${r.value.toFixed(2)}%${r.value===0?' 平盘':''}</span>`}
function predictionDate(session){const formatDate=value=>{const digits=String(value??'').replace(/\D/g,'');return digits.length===8?`${digits.slice(0,4)}-${digits.slice(4,6)}-${digits.slice(6,8)}`:'待确定'};const known=session?.models&&Object.values(session.models).flatMap(g=>(g.rows||[]).map(r=>r.returns?.['1']?.date)).find(Boolean);if(known)return formatDate(known);const digits=String(session.date).replace(/\D/g,'');const d=new Date(`${digits.slice(0,4)}-${digits.slice(4,6)}-${digits.slice(6,8)}T12:00:00`);if(Number.isNaN(d.getTime()))return '待确定';do{d.setDate(d.getDate()+1)}while(d.getDay()===0||d.getDay()===6);return d.toISOString().slice(0,10)}
function filterBar(state,sessions,references=[]){const latestDate=sessions[0]?.date;return `<div class="daily-filters"><label>选股日期 <select id="dailyDate"><option value="latest" ${state.date==='latest'?'selected':''}>最新结果${latestDate?' · '+safe(latestDate):''}</option>${sessions.filter(s=>s.date!==latestDate).map(s=>`<option value="${safe(s.date)}" ${state.date===s.date?'selected':''}>${safe(s.date)} · ${safe(s.kind||'历史记录')}</option>`).join('')}</select></label>${references.length?`<label>参考形态 <select id="dailyReference">${references.map(t=>`<option value="${safe(t['代码'])}" ${state.reference===t['代码']?'selected':''}>${safe(t['名称'])} ${safe(t['代码'])}</option>`).join('')}</select></label>`:''}</div>`;}
function patternPanel(id,state){
    const second=id==='second',payload=second?dailyExtra.second:dailyExtra.patterns;
    if(!payload)return '<p class="daily-error">该模型尚未生成数据。</p>';
    const references=second?[]:(payload.templates||[]).filter(t=>(id==='limit1'?['001299','002295']:['002155','002349']).includes(t['代码']));
    const reference=second?'second_buy':state.reference;
    const template=second?payload.template:references.find(t=>t['代码']===reference);
    const sessions=(payload.sessions||[]).filter(s=>s.date>=template?.['结束日']&&s.models[reference]);
    const session=state.date==='latest'?sessions[0]:sessions.find(s=>s.date===state.date);
    const group=session?.models[reference];
    let html=filterBar(state,sessions,references);
    html+=`<h2>${second?'类二买':safe(template?.['名称'])+' · 涨停形态'}</h2><p class="daily-note">参考股 ${safe(template?.['代码'])} · ${safe(template?.['开始日'])} 至 ${safe(template?.['结束日'])}</p>`;
    if(second)html+=`<p class="daily-note">沪深主板及创业板非 ST · 股票池 ${payload.universe_count} 只，其中创业板 ${payload.growth_count} 只</p>`;
    if(!group)return html+`<p class="daily-error">${safe(payload.status||'所选日期暂无结果')}</p>`;
    if(session.date!==payload.daily_date)html+=`<p class="daily-error">最新行情日 ${safe(payload.daily_date)} 尚无完整结果，当前显示 ${safe(session.date)} 的历史记录。</p>`;
    html+=`<p class="daily-summary"><span>选股日 ${safe(session.date)}</span><span class="prediction-date">预测日 ${safe(predictionDate(session))}</span><span>${safe(session.kind)}</span><span>日K覆盖 ${session.coverage}/${payload.universe_count}</span><span>符合条件 ${group.eligible} 只 · 入选 ${group.rows.length} 只</span><span>生成 ${safe(payload.generated_at)}</span></p>`;
    html+='<p class="daily-note"><span style="color:#2563eb">━━ 候选走势</span>　<span style="color:#b87915">━━ 参考走势</span></p>';
    const displayed=[...group.rows].sort((a,b)=>(Number(a[state.sortKey])-Number(b[state.sortKey]))*state.sortDirection),rankArrow=state.sortKey==='rank'?(state.sortDirection===1?'↑':'↓'):'↕',similarityArrow=state.sortKey==='similarity'?(state.sortDirection===1?'↑':'↓'):'↕';
    html+=`<div class="wrap"><table><thead><tr><th><button type="button" class="sort-button${state.sortKey==='rank'?' active':''}" data-pattern-sort="rank">排名 ${rankArrow}</button></th><th>股票</th><th>次日收益</th><th>3日收益</th><th>5日收益</th><th><button type="button" class="sort-button${state.sortKey==='similarity'?' active':''}" data-pattern-sort="similarity">相似度 ${similarityArrow}</button></th><th>走势对照</th>${second?'<th>D1 / D2</th><th>低点价差</th><th>D2 状态</th>':''}<th>${second?'上涨段涨停':'近30日涨停'}</th><th>选股收盘</th></tr></thead><tbody>`;
    html+=displayed.map(r=>`<tr><td>${r.rank}</td><td><b>${safe(r.name)}</b><br>${safe(r.code)}</td><td>${dailyReturn(r,'1')}</td><td>${dailyReturn(r,'3')}</td><td>${dailyReturn(r,'5')}</td><td>${r.similarity.toFixed(1)}</td><td>${dailyChart(r.path,template.path)}<small>${safe(r.start)} → ${safe(session.date)}</small></td>${second?`<td>${r.structure.D1.price.toFixed(2)} / ${r.structure.D2.price.toFixed(2)}</td><td>${r.structure.gap_pct.toFixed(2)}%</td><td>${r.structure.d2_confirmed?'底分型已确认':'回调低点待确认'}</td>`:''}<td>${r.limit_dates.map(safe).join('<br>')||'无'}</td><td>${r.close.toFixed(2)}</td></tr>`).join('')||`<tr><td colspan="${second?12:9}">暂无符合条件的股票，不足5只不补位。</td></tr>`;
    html+='</tbody></table></div>';
    if(second){
        html+=group.rows.map(r=>`<details class="daily-rules"><summary>${safe(r.code)} ${safe(r.name)} · 结构点位</summary><div class="daily-points">${['D0','G1','D1','G2','D2'].map(k=>`<span><b>${k} ${r.structure[k].price.toFixed(2)}</b><small>${safe(r.structure[k].date)}</small></span>`).join('')}</div><p>中枢重叠区间：${r.structure.center_low.toFixed(2)} 至 ${r.structure.center_high.toFixed(2)}</p></details>`).join('');
        html+='<details class="daily-rules"><summary>模型条件与计算口径</summary><p>D0 底分型后上涨至 G1，回调 D1 &gt; D0，再上涨至 G2，回调 D2 ≥ D1；G1—D1—G2—D2 三段存在非零价格重叠。先按固定参考区间相似度选前5只，再按两段上涨 D0—G1 / D1—G2 有收盘涨停优先、(D2/D1−1) 价差更小优先、相似度更高排序。无涨停不剔除。</p><p>相似度窗口25个交易日。结构识别向前补充6根K线，经包含关系处理后，相邻转折至少相隔2根处理后K线。D2 可为正在形成的回调低点，确认状态单独列出。这是类二买形态，不是严格缠论买点确认。参考股 D0 为2026-07-30；参考相似度区间仍为2026-08-03至2026-09-04。</p><p>主板10%、创业板20%，按前收盘计算到分的涨停价；前5根可用日K不授予涨停优先。历史使用选股日及之前的数据，9月4日前不使用此模板。相似度不是上涨概率。</p></details>';
    }
    html+='<p class="daily-note">历史重算使用当前股票池及缓存，区别于当时实盘记录。收益按之后第1、3、5个市场交易日收盘结算，停牌或缺失日K不顺延。</p>';
    return html;
}
function promotionPanel(state){const payload=dailyExtra.promotion;if(!payload)return '<p class="daily-error">涨停晋级模型尚未生成。</p>';const sessions=payload.sessions||[],session=state.date==='latest'?sessions[0]:sessions.find(s=>s.date===state.date);if(!session)return filterBar(state,sessions)+'<p class="daily-error">所选日期暂无结果。</p>';const rows=session.rows||[];let html=filterBar(state,sessions);html+=`<h2>涨停晋级 · 试验模型</h2><p class="daily-summary"><span>选股日 ${safe(session.date)}</span><span>预测日 ${safe(session.prediction_date)}</span><span>候选 ${rows.length} 只</span><span>生成 ${safe(payload.generated_at)}</span></p><p class="daily-note">${safe(payload.note)}</p>`;html+='<div class="wrap"><table><thead><tr><th>排名</th><th>股票</th><th>次日结果</th><th>次日收益</th><th>连板数</th><th>首次封板</th><th>炸板</th><th>换手率</th><th>封单/流通市值</th><th>流通市值</th><th>行业</th></tr></thead><tbody>';html+=rows.map(r=>{const value=r['次日收益%'],cls=value>0?'pos':value<0?'neg':'flat';return `<tr><td>${r['排名']}</td><td><b>${safe(r['名称'])}</b><br>${safe(r['代码'])}</td><td>${safe(r['次日结果'])}</td><td class="${cls}">${value==null?'--':`${value>0?'+':''}${Number(value).toFixed(2)}%`}</td><td>${r['连板数']}</td><td>${safe(r['首次封板'])}</td><td>${r['炸板次数']}</td><td>${r['换手率%']}%</td><td>${r['封单占流通市值%']}%</td><td>${r['流通市值亿元']}亿</td><td>${safe(r['行业'])}</td></tr>`}).join('');return html+'</tbody></table></div>'}
function potentialPanel(){const payload=dailyExtra.potential;if(!payload)return '<p class="daily-error">首板潜力模型尚未生成。</p>';let html=`<h2>首板潜力 TOP10 · 试验模型</h2><p class="daily-summary"><span>数据日 ${safe(payload.daily_date)}</span><span>生成 ${safe(payload.generated_at)}</span></p><p class="daily-note">${safe(payload.note)}</p><div class="wrap"><table><thead><tr><th>排名</th><th>股票</th><th>潜力分</th><th>板块涨停数</th><th>换手率</th><th>封单/流通市值</th><th>炸板</th><th>流通市值</th><th>行业</th></tr></thead><tbody>`;html+=(payload.rows||[]).map(r=>`<tr><td>${r['排名']}</td><td><b>${safe(r['名称'])}</b><br>${safe(r['代码'])}</td><td>${Number(r['潜力分']).toFixed(3)}</td><td>${r['板块涨停家数']}</td><td>${r['换手率%']}%</td><td>${r['封单占流通市值%']}%</td><td>${r['炸板次数']}</td><td>${r['流通市值亿元']}亿</td><td>${safe(r['行业'])}</td></tr>`).join('');return html+'</tbody></table></div>'}
draw=function(){
    if(!data)return;
    stickyControls.querySelector('.daily-filters')?.remove();
    const id=activeDaily,state=stateFor(id),content=document.getElementById('content');
    const isMA=id==='ma10'||id==='ma20';
    if(isMA){
        tab='focus';oldDraw();
        content.querySelectorAll('.model').forEach(section=>{if(section.querySelector('h2')?.textContent!==modelName(id))section.remove()});
        const sessions=(performanceData?.history||[]).map(s=>({...s,date:s['选股日'],kind:'已结算'}));
        const bar=filterBar(state,[{date:data.date,kind:'当前行情'} ,...sessions]);
        if(state.date!=='latest'){
            const session=sessions.find(s=>s.date===state.date),rows=(session?.rows||[]).filter(r=>r['模型']===modelName(id));
            content.innerHTML=`<h2>${modelName(id)} · 历史记录</h2><p class="daily-note">选股日 ${safe(state.date)} · 结果日 ${safe(session?.['结果日'])}</p>${table(rows,'当日无正式入选股票。')}`;
        }
        content.insertAdjacentHTML('afterbegin',bar);
    }else if(id==='strict'||id==='long'){tab=id;oldDraw()}
    else if(id==='promotion'){content.innerHTML=promotionPanel(state)}
    else if(id==='potential'){content.innerHTML=potentialPanel()}
    else{content.innerHTML=patternPanel(id,state)}
    const focus=document.getElementById('focusWatch');if(focus)focus.hidden=!isMA||state.date!=='latest';
    document.getElementById('ruleGate').hidden=!isMA&&id!=='strict'&&id!=='long';
    dailyNav.innerHTML=primaryDailyModels.map(([key,label])=>`<button type="button" id="daily-${key}" role="tab" data-daily="${key}" aria-controls="content" aria-selected="${key===id}" tabindex="${key===id?0:-1}">${label}</button>`).join('')+`<details class="experimental-models"${['promotion','potential'].includes(id)?' open':''}><summary>试验模型 ▾</summary><div class="experimental-options">${dailyModels.filter(([key])=>['promotion','potential'].includes(key)).map(([key,label])=>`<button type="button" id="daily-${key}" role="tab" data-daily="${key}" aria-controls="content" aria-selected="${key===id}" tabindex="${key===id?0:-1}">${label}</button>`).join('')}</div></details>`;
    content.setAttribute('role','tabpanel');content.setAttribute('tabindex','0');
    if(dailyModels.some(x=>x[0]===id))content.setAttribute('aria-labelledby','daily-'+id);else content.removeAttribute('aria-labelledby');
    const date=document.getElementById('dailyDate');if(date){stickyControls.append(date.closest('.daily-filters'));date.onchange=()=>{state.date=date.value;draw()}};
    const ref=document.getElementById('dailyReference');if(ref)ref.onchange=()=>{state.reference=ref.value;state.date='latest';draw()};
    content.querySelectorAll('[data-pattern-sort]').forEach(button=>button.onclick=()=>{const key=button.dataset.patternSort;state.sortDirection=state.sortKey===key?-state.sortDirection:(key==='rank'?1:-1);state.sortKey=key;draw()});
};
if(data)draw();
</script></body></html>
