</script><div style="max-width:1500px;margin:16px auto;padding:0 36px"><a href="history-30.html">查看最近30个交易日历史</a></div><main><h1>WaXwing · 市场观察</h1><div id="meta" class="meta"></div><section id="focusWatch" class="focus-watch" aria-label="下一交易日重点盯盘" hidden></section><div class="review-bar"><button id="openPerformance" class="review-btn" type="button">历史命中复盘 <span id="performanceCount" class="review-count">0</span></button><span id="performanceBrief" class="review-brief">点击查看最近3个工作日</span></div><div id="performanceModal" class="modal hide" role="dialog" aria-modal="true" aria-labelledby="performanceTitle"><div class="modal-panel"><div class="modal-head"><h2 id="performanceTitle">历史命中复盘</h2><button id="closePerformance" class="modal-close" type="button" aria-label="关闭">×</button></div><div id="performance" class="modal-body"></div></div></div><div class="gate" id="ruleGate"><label for="rulePass">模型条件</label><input id="rulePass" type="password" inputmode="numeric" autocomplete="current-password" placeholder="输入口令"><button id="unlockRules" type="button">查看</button><span id="ruleMsg">条件已隐藏</span></div><div class="tabs"></div><div id="content"></div><script>

function drawFocus(payload){
    const box=document.getElementById('focusWatch'),f=payload.focus_watchlist;
    if(!f){box.innerHTML='<h2>下一交易日重点盯盘</h2><p class="focus-note">本期尚未生成重点名单，等待下一次正式扫描。</p>';return}
    const preview=payload.is_intraday_preview||f.status==='preview';
    const price=value=>Number(value).toFixed(2);
    const cards=(f.picks||[]).map(p=>`<article class="focus-card"><h3>${esc(p['重点排名'])}. ${esc(p['名称'])} <small>${esc(p['代码'])}</small></h3>${rulesUnlocked?`<span class="badge">${esc(p['模型'])} · 原排名 ${esc(p['原排名'])}${p['历史近邻Top3']&&p['历史近邻Top3']['可排序']?' · 近邻投票'+esc(p['历史近邻Top3']['近邻综合分']):p['形态相似度']!==null&&p['形态相似度']!==undefined?' · 形态'+esc(p['形态相似度']):''}${p['缩量蓄势匹配']?' · 缩量蓄势5/5':''}</span><ul>${p['入选依据'].map(r=>`<li>${esc(r)}</li>`).join('')}</ul><p class="focus-level"><strong>转强观察：</strong>站上信号日高点 ${price(p['信号高点'])} 后，观察回踩能否守住。</p><p><strong>均线参照：</strong>${esc(p['均线'])} ${price(p['均线值'])}，${p['检查']['收在均线上']?'失守则降低优先级':'目前尚未站回，先等待修复'}；跌破信号日低点 ${price(p['信号低点'])} 取消本轮观察。</p>`:'<p class="focus-note">选股依据已隐藏，输入口令后查看。</p>'}</article>`).join('');
    const votePicks=(f.ma10_neighbor_watch||[]).filter(p=>p['历史近邻Top3']&&p['历史近邻Top3']['可排序']);
    const voteTable=rulesUnlocked&&votePicks.length?`<div class="focus-vote-table"><h3>10日线Top3近邻投票对照</h3><p class="focus-note">独立展示10日线组内前三，不改变上方最终重点名单。</p><table><thead><tr><th>当前票</th><th>Top3历史样本</th><th>次日上涨率</th><th>次日涨停率</th><th>最大回撤</th></tr></thead><tbody>${votePicks.map(p=>{const v=p['历史近邻Top3'],names=v['历史样本'].map(s=>`${esc(s['名称'])} ${Number(s['次日涨跌幅%'])>=0?'+':''}${esc(s['次日涨跌幅%'])}%`).join(' / ');return `<tr><td>${esc(p['近邻排名'])}. ${esc(p['名称'])}</td><td>${names}</td><td>${esc(v['次日上涨率%'])}%</td><td>${esc(v['次日涨停率%'])}%</td><td>${esc(v['次日盘中最大回撤%'])}%</td></tr>`}).join('')}</tbody></table></div>`:'';

function focusReview(session,model){
    const review=session['重点盯盘'];

    const allRows=[...(review.rows||[])].sort((a,b)=>a['重点排名']-b['重点排名']);

    const location=rows.length?`当前${esc(model)}表内有${rows.length}只，已在原排名行标星。`:`当前${esc(model)}表内没有；请切换另一模型Tab查看星标位置。`;
    return `<div class="focus-review"><strong>当时额外精选（跨模型）</strong> · ${esc(review.version)}<br>${allRows.map(r=>`${esc(r['重点排名'])}. ${esc(r['名称'])}（${esc(r['模型'])}原排名${esc(r['排名'])}）：${performancePercent(r['次日涨跌幅%'])}`).join('；')}<br>3只整体上涨率 ${performancePercent(q.upRate)} · 平均 ${performancePercent(q.average)}。${location}仅对比收盘表现，不代表交易收益。</div>`;

const esc=s=>String(s??'-').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const pageDateTime=value=>{const text=String(value??''),date=pageDate(text),match=text.match(/(?:T|\s)(\d{2}:\d{2}:\d{2})/);return date==='--'?'--':date+(match?' '+match[1]:'')};
const tableSorts=new Map();

function d2ArchivedEvents(){
    const days=Array.isArray(dailyExtra.d2History?.days)?dailyExtra.d2History.days:[];
    const records=days.filter(day=>day.date).flatMap(day=>(day.rows||[]).filter(row=>!d2ManuallyExcluded(row.code,day.date)).flatMap(row=>(row.d2_alert_events||[]).filter(event=>event.event_key&&String(event.first_observed_at||'').slice(0,10)===day.date&&String(event.confirmed_at||'').slice(0,10)===day.date).map(event=>({row,event,date:day.date}))));
    const unique=new Map();
    for(const item of records){
        const key=`${item.date}|${item.row.code}|${item.event.source}|${String(item.event.confirmed_at).slice(0,19)}`,prior=unique.get(key);

    }

function freezeIdentityColumns(table){
    const header=[...table.tHead?.rows[0]?.cells||[]];
    if(!header.length)return;
    const labels=header.map(cell=>cell.textContent.replace(/\s+/g,' ').trim());
    const compactIdentity=/排名$/.test(labels[0]||'')&&labels[1]==='股票';
    if(compactIdentity)table.classList?.add('compact-identity-table');
    const wanted=['爆发潜力评分','排名','选股时排名','代码','名称','股票'];
    const indexes=[];
    labels.forEach((label,index)=>{if(wanted.some(name=>label===name||label.startsWith(name)))indexes.push(index)});
    header.forEach((cell,index)=>{if(cell.classList.contains('stock-sticky')&&!indexes.includes(index))indexes.push(index)});
    if(!indexes.length)indexes.push(0);
    const cols=[...new Set(indexes)].sort((a,b)=>a-b);
    let offset=0;
    cols.forEach((index,order)=>{
        const measured=header[index]?.getBoundingClientRect().width||0;
        const width=compactIdentity?(measured||(order===0?40:104)):Math.max(measured,index===cols[0]?56:72);
        // HTMLTableElement.rows contains only this table's rows. A descendant
        // query also reaches the buy/sell condition tables and makes their
        // first cells sticky above the outer header while scrolling.
        [...table.rows].forEach(row=>{
            const cell=row.cells[index];
            if(!cell)return;
            cell.classList.add('stock-sticky');
            cell.style.left=offset+'px';
            cell.style.zIndex=String((cell.tagName==='TH'?6:3)-order);
        });
        offset+=width;
    });
}

    const history=[...(outcomes.trend_history||[]),...(dailyExtra.shortCycleAlertRates?.events||[]).filter(item=>item.rule_versions?.includes('model-daily-bottom-close-v1'))].filter(item=>item.model==='日线趋势一买');
    const triggerDate=item=>{const digits=dateKey(item?.triggered_at);return digits?`${digits.slice(0,4)}-${digits.slice(4,6)}-${digits.slice(6,8)}`:''};
    const dates=[...new Set(history.map(triggerDate).filter(Boolean))].sort().reverse();
    const focusSignalDate=dates.find(date=>dateKey(date)===focusDate)||'';
    if(focusSignalDate)state.signalDate=focusSignalDate;
    else if(focusCode&&focusDate===dateKey(data.daily_date))state.signalDate='latest';
    if(state.signalDate!=='latest'&&!dates.includes(state.signalDate))state.signalDate=dates[0]||'';
    const selectedDate=state.signalDate,selectedEvents=selectedDate==='latest'?[]:history.filter(item=>triggerDate(item)===selectedDate);
    const historicalEvidence=(event={},outcome={})=>{const period=event['周期']||'30分钟',other=period==='60分钟'?'30分钟':'60分钟';const signal={...event,'状态':event['状态']||`末段＋${period}底背离`,'提醒条件满足':event['提醒条件满足']!==false,'提醒状态':outcome.origin==='实时归档'?'有效':'历史回放，非实时推送'};return {'结构首次可见时间':outcome.structure_available_at||event['结构首次可见时间']||null,'提醒':signal,[period]:signal,[other]:{'状态':'未出现','周期':other}}};
    const allRows=selectedDate==='latest'?currentRows.map(row=>({...row})):selectedEvents.map(item=>{const fallback=currentRows.find(row=>String(row['代码']).padStart(6,'0')===String(item.code).padStart(6,'0'))||{},snapshot=item.structure_snapshot||{};return {...snapshot,'代码':String(item.code).padStart(6,'0'),'名称':snapshot['名称']||item.name||fallback['名称']||item.code,_trendHistoryEvent:item.evidence||{},_trendOutcome:item}});
    if(focusCode){
        const existing=allRows.find(row=>String(row['代码']).padStart(6,'0')===focusCode);
        if(existing)existing._lookupFocus=true;
    }
    const evidenceOf=row=>row._trendOutcome?historicalEvidence(row._trendHistoryEvent,row._trendOutcome):weeklyShortCycleEvidence('日线趋势一买',row['代码'],row['第二修复峰日期'],row['Price_B日期']||row['B日期']);
    const caseKey=row=>`日线趋势一买|${String(row['代码']).padStart(6,'0')}|${row['第二修复峰日期']}|${row['Price_B日期']||row['B日期']}`;
    const outcomeOf=row=>row._trendOutcome||cases[caseKey(row)]||null;
    const returnCell=(item,horizon)=>{const one=item?.outcomes?.[String(horizon)]||{};if(one.status!=='已结算')return `<span class="pending-return">${safe(one.status||'待结算')}</span>`;return returnPct(one.return_pct)};
    const rows=shortCycleFilteredRows(state,allRows,evidenceOf);
    recordDisplayedReminders(state,rows,selectedDate==='latest'?evidenceOf:null);
    const forming=rows.filter(row=>row['状态']==='背驰形成中'),confirmed=rows.filter(row=>row['状态']==='背驰已确认');

    const ageChoices=(model.b_age_options||[5,10,15]).map(days=>`<option value="${days}" ${bAge===Number(days)?'selected':''}>最近${days}个交易日</option>`).join('');
    const dateChoices=`<option value="latest"${selectedDate==='latest'?' selected':''}>当前候选（截至${safe(formatDate(data.daily_date))}）</option>`+dates.map(date=>{const events=history.filter(item=>triggerDate(item)===date);return `<option value="${safe(date)}"${selectedDate===date?' selected':''}>${safe(formatDate(date))} · 提醒触发${events.length}次／${new Set(events.map(item=>item.code)).size}只</option>`}).join('');
    const dateFilter=`<div class="daily-filters trend-date-filter"><label>提醒触发日期 <select id="twoCenterSignalDate">${dateChoices}</select></label></div>`;
    const preview=data.is_intraday_preview?'<p class="preclose-warning"><strong>盘中预览：</strong>当日日K尚未收盘，最终形态以收盘扫描为准，不发正式通知。</p>':'';
    const focusRow=rows.find(row=>row._lookupFocus),focusNotice=focusRow?`<p class="stock-lookup-focus"><strong>股票检索定位：</strong>${safe(focusRow['名称'])} ${safe(focusRow['代码'])} · 记录日期 ${safe(formatDate(state.focusDate||data.daily_date))}；已在当前日线趋势一买列表中定位。</p>`:'';
    const body=rows.map((row,index)=>{const outcome=outcomeOf(row),focused=row===focusRow;return `<tr${focused?' class="stock-lookup-focus-row" data-stock-lookup-focus-row':''}><td>${index+1}${focused?'<br><small>检索定位</small>':''}</td><td><b>${safe(row['名称'])}</b><br>${safe(row['代码'])}</td>${shortCycleConditionCell(evidenceOf(row),'日线趋势一买',row['代码'],selectedDate==='latest'?data.daily_date:selectedDate)}<td class="focus-reason"><b>D5价格低于D3，但DIF、绿柱和下跌力度均弱于D3</b><small>D3 ${safe(formatDate(row['A日期']))} → D5 ${safe(formatDate(row['B日期']))}</small></td><td><span class="two-center-status${row['状态']==='背驰形成中'?' alert':''}">${safe(row['状态'])}</span></td><td><button type="button" class="m30-detail-open" data-daily-first-detail="${safe(row['代码'])}">▶ 查看日线D3/D5</button></td><td>${safe(formatDate(row['B日期']))}<br>${safe(row['Price_B'])}<br><small>${selectedDate==='latest'?`距今${safe(row['B距今天数'])}日`:'当时结构快照'}</small></td><td>${outcome?safe(formatDateTime(outcome.triggered_at)):'未触发'}</td><td>${safe(outcome?.origin||'未归档')}</td><td>${operationLatestReturnCell('日线趋势一买',row['代码'],outcome,Boolean(outcome))}</td>${EXIT_RETURN_HORIZONS.map(h=>`<td>${returnCell(outcome,h)}</td>`).join('')}<td class="sell-condition-cell">${strictM30ExitReturnCell('日线趋势一买',row,evidenceOf(row),selectedDate==='latest'?data.daily_date:selectedDate)}</td></tr>`}).join('');

    const detail=selectedDetail||null;

    const modal=detail?`<div class="second-detail-modal m30-detail-modal" data-daily-first-modal role="presentation"><section class="second-detail-dialog m30-detail-dialog" role="dialog" aria-modal="true" aria-labelledby="dailyFirstDetailTitle"><header class="second-detail-head"><div><h3 id="dailyFirstDetailTitle">${safe(detail['名称'])} ${safe(detail['代码'])} · 日线D3/D5</h3><p>当前选择：回溯${lookback}个交易日 · B距今≤${bAge}个交易日 · 实际展示${chartDates.length}根日K</p><p>图表区间：${safe(formatDate(chartDates[0]))} — ${safe(formatDate(chartDates[chartDates.length-1]))}</p></div><button type="button" class="second-detail-close" data-daily-first-close aria-label="关闭弹窗">×</button></header><label class="macd-zoom">横轴拉伸 <input type="range" min="820" max="2200" step="140" value="1100" data-macd-zoom></label>${chartDates.length?`${macdValleyChart(detail,'价格')}${macdValleyChart(detail,'DIF')}${macdValleyChart(detail,'MACD')}`:'<p class="daily-note">原历史结构图表未归档；当前图表不作为历史依据。</p>'}<p class="macd-shape-note">D3/D5价格低点 ${safe(formatDate(detail['Price_A日期']))} → ${safe(formatDate(detail['Price_B日期']))}；两个修复峰 ${safe(formatDate(detail['第一修复峰日期']))} → ${safe(formatDate(detail['第二修复峰日期']))}。</p></section></div>`:'';

function moveReasonColumns(root){
    for(const table of root.querySelectorAll('table')){
        const header=table.tHead?.rows?.[0];
        if(!header)continue;
        const triggerIndex=[...header.cells].findIndex(cell=>['提醒触发时间','选出／提醒触发时间','提醒触发／观察时间'].includes(cell.textContent.trim()));
        if(triggerIndex>=0&&[...header.cells].some(cell=>cell.textContent.trim()==='买入提醒条件')){
            const count=header.cells.length;
            for(const row of table.tBodies[0]?.rows||[]){
                if(row.cells.length===count)row.cells[triggerIndex].remove();
            }
            header.cells[triggerIndex].remove();
        }
        const index=[...header.cells].findIndex(cell=>cell.textContent.trim()==='入选原因');
        if(index>=0&&index!==header.cells.length-1){
            const count=header.cells.length,reason=header.cells[index];
            reason.classList.add('focus-reason-head');header.append(reason);
            for(const row of table.tBodies[0]?.rows||[]){
                if(row.cells.length===count)row.append(row.cells[index]);
            }
        }
        const cells=[...header.cells],buyIndex=cells.findIndex(cell=>cell.textContent.trim()==='买入提醒条件');
        const sellIndex=cells.findIndex(cell=>cell.textContent.trim()==='卖出提醒条件');
        if(buyIndex>=0)cells[buyIndex].classList.add('buy-condition-head');
        if(sellIndex>=0)cells[sellIndex].classList.add('sell-condition-head');
        if(buyIndex<0||sellIndex<0||sellIndex===buyIndex+1)continue;
        const count=cells.length;
        header.insertBefore(header.cells[sellIndex],header.cells[buyIndex].nextElementSibling);
        for(const row of table.tBodies[0]?.rows||[]){
            if(row.cells.length===count)row.insertBefore(row.cells[sellIndex],row.cells[buyIndex].nextElementSibling);
        }
    }
}
function dailyConsolidationChart(row,kind){
    const chart=row['形态图']||{},dates=chart['日期']||[],n=dates.length;
    if(n<2)return '';
    const series=key=>(chart[key]||[]).map(value=>Number(value));
    const opens=series('开盘'),closes=series('收盘'),highs=series('最高'),lows=series('最低'),dif=series('DIF'),dea=series('DEA'),hist=series('MACD');
    const price=kind==='价格',W=1200,H=255,x=i=>46+i*(W-92)/(n-1);
    const bounds=(price?[...highs,...lows]:[...dif,...dea,...hist,0]).filter(Number.isFinite);
    const lo=Math.min(...bounds),hi=Math.max(...bounds),span=hi-lo||1,y=v=>H-34-(v-lo)/span*(H-58);
    const line=(values,color,weight=2)=>`<polyline points="${values.map((value,i)=>`${x(i)},${y(value)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="${weight}"/>`;
    const centers=chart['中枢']||{},nodes=chart['节点']||{},legs=chart['比较段']||{},at=date=>dates.indexOf(String(date||''));
    let draw='';
    if(price){
        const from=at(centers.start_date),to=at(centers.end_date),zd=Number(centers.ZD),zg=Number(centers.ZG);
        if(from>=0&&to>=0&&Number.isFinite(zd)&&Number.isFinite(zg))draw+=`<rect x="${x(from)}" y="${y(zg)}" width="${Math.max(1,x(to)-x(from))}" height="${Math.max(1,y(zd)-y(zg))}" fill="#facc15" fill-opacity=".28" stroke="#d97706" stroke-width="2"/><text x="${x(from)+5}" y="${Math.max(16,y(zg)-6)}" fill="#92400e" font-size="14">重叠区[${safe(zd)},${safe(zg)}]</text>`;
        draw+=closes.map((value,i)=>{if(![opens[i],highs[i],lows[i],value].every(Number.isFinite))return '';const color=value>=opens[i]?'#dc2626':'#16a34a';return `<line x1="${x(i)}" x2="${x(i)}" y1="${y(highs[i])}" y2="${y(lows[i])}" stroke="${color}"/><rect x="${x(i)-1.8}" y="${Math.min(y(opens[i]),y(value))}" width="3.6" height="${Math.max(1,Math.abs(y(opens[i])-y(value)))}" fill="${color}"/>`}).join('');
        const ordered=['H0','D1','G1','D2','G2','D3'].map(name=>({name,marker:nodes[name]})).filter(item=>item.marker&&at(item.marker.date)>=0);
        if(ordered.length>1)draw+=`<polyline points="${ordered.map(item=>`${x(at(item.marker.date))},${y(Number(item.marker.price))}`).join(' ')}" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="5 3"/>`;
        for(const [left,right,color] of [['H0','D1','#7c3aed'],['G2','D3','#be123c']]){if(nodes[left]&&nodes[right]&&at(nodes[left].date)>=0&&at(nodes[right].date)>=0)draw+=`<line x1="${x(at(nodes[left].date))}" y1="${y(Number(nodes[left].price))}" x2="${x(at(nodes[right].date))}" y2="${y(Number(nodes[right].price))}" stroke="${color}" stroke-width="4"/>`}
        for(const [name,marker] of Object.entries(nodes)){const i=at(marker.date);if(i<0)continue;const value=Number(marker.price),color=name==='D3'?'#be123c':'#2563eb';draw+=`<circle cx="${x(i)}" cy="${y(value)}" r="4" fill="${color}"><title>${safe(name)} ${safe(marker.date)} / ${safe(marker.price)}；确认 ${safe(marker.confirm_time||'待确认')}</title></circle><text x="${x(i)+4}" y="${Math.max(16,y(value)-7)}" fill="${color}" font-size="14" font-weight="bold">${safe(name)}</text>`}
    }else{
        draw=`<line x1="46" x2="1154" y1="${y(0)}" y2="${y(0)}" stroke="#94a3b8" stroke-dasharray="5 4"/>`;
        draw+=hist.map((value,i)=>`<line x1="${x(i)}" x2="${x(i)}" y1="${y(0)}" y2="${y(value)}" stroke="${value<0?'#06b6d4':'#ef4444'}" stroke-width="3"/>`).join('')+line(dif,'#2563eb',2.5)+line(dea,'#d97706',2);
        for(const [key,color] of [['A','#7c3aed'],['C','#be123c']]){const leg=legs[key]||{},from=at(leg.start),to=at(leg.end);if(from<0||to<0)continue;draw+=`<rect x="${x(from)}" y="16" width="${Math.max(1,x(to)-x(from))}" height="${H-47}" fill="${color}" fill-opacity=".07" stroke="${color}" stroke-dasharray="5 4"/><text x="${x(from)+5}" y="29" fill="${color}" font-size="14" font-weight="bold">${key==='A'?'前段A':'末段C'}</text>`}
    }
    return `<div class="macd-chart-panel"><strong>${price?'日K：H0→D1→G1→D2→G2→D3；黄色为三笔重叠区':'日线MACD(12,26,9)：紫色前段A / 红色末段C'}</strong><div class="macd-chart-scroll"><svg viewBox="0 0 ${W} ${H}" style="width:${W}px;height:${H}px" role="img" aria-label="${price?'日线笔级盘整价格图':'两段MACD比较图'}">${draw}<text x="46" y="${H-8}" fill="#64748b" font-size="12">${safe(formatDate(dates[0]))}</text><text x="1040" y="${H-8}" fill="#64748b" font-size="12">${safe(formatDate(dates[n-1]))}</text></svg></div></div>`;
}
function dailyConsolidationSignalDate(row,fallbackDate){
    if(shortCycleConditionState(row).appeared){
        const fractalDate=dateKey(shortCycleTriggerTime(null,row));
        if(fractalDate)return fractalDate;
    }
    if(row['状态']==='转折确认')return dateKey(row['实际确认时间']);
    const observed=dateKey(row['首次记录时间']),marketDate=dateKey(fallbackDate);
    // A scan of already closed bars may first run on a later calendar day
    // (including a market holiday). Keep its discovery timestamp for audit,
    // but never turn that day into a new market/signal date in this filter.
    return observed&&marketDate&&observed>marketDate?'':observed||marketDate;

function syncChartTimeAxes(container){
    const scrollers=[...container.querySelectorAll('.macd-chart-scroll')];
    if(scrollers.length<2)return;
    let updating=false;
    scrollers.forEach(source=>source.addEventListener('scroll',()=>{
        if(updating)return;
        const span=Math.max(0,source.scrollWidth-source.clientWidth);
        const progress=span?source.scrollLeft/span:0;
        updating=true;
        for(const target of scrollers){
            if(target===source)continue;
            const next=progress*Math.max(0,target.scrollWidth-target.clientWidth);
            if(Math.abs(target.scrollLeft-next)>1)target.scrollLeft=next;
        }
        updating=false;
    },{passive:true}));
}

function holdingSimulation(positions,options={}){
    const principal=Number(options.principal),perTrade=Number(options.perTrade),startDate=String(options.startDate||'').slice(0,10),through=String(options.through||'').slice(0,10);
    if(!Number.isFinite(principal)||!Number.isFinite(perTrade)||!(principal>0)||!(perTrade>0)||!/^\d{4}-\d{2}-\d{2}$/.test(startDate)||!through||startDate>through)return {error:'请输入有效的本金、单笔上限和开始日期。'};
    const events=[],pending=[],missingPrices=[];
    (positions||[]).forEach((item,index)=>{
        if(options.excludeChiNext&&/^30[01]\d{3}$/.test(String(item.code)))return;
        const signalDay=String(item.buy_date||item.buy_at||'').slice(0,10),buyDay=String(item.buy_effective_date||'').slice(0,10);
        if(!buyDay){if(signalDay>=startDate&&signalDay<=through)pending.push(item);return}
        if(buyDay>through){if(signalDay<=through)pending.push(item);return}
        if(buyDay<startDate)return;
        const price=Number(item.buy_price??item.buy_trigger_price);
        if(!Number.isFinite(price)||price<=0){missingPrices.push(item);return}
        const buyAt=buyDay+' '+(String(item.buy_at||'').slice(11)||'15:00:00');
        events.push({type:'buy',at:buyAt,index,item,price});
        const sellDay=String(item.sell_effective_date||item.sell_execution_date||'').slice(0,10),sellPrice=Number(item.sell_price);
        if(item.sell_signal_triggered&&sellDay&&sellDay<=through&&sellPrice>0){
            const sellAt=sellDay+' '+(String(item.sell_execution_at||'').slice(11)||'15:00:00');
            events.push({type:'sell',at:sellAt,index,item,price:sellPrice});
        }
    });
    const modelReturn=item=>{
        const value=options.modelReturns?.[item.source_model];
        return value!=null&&Number.isFinite(Number(value))?Number(value):-Infinity;
    };
    events.sort((a,b)=>{
        const timeOrder=a.at.localeCompare(b.at);
        if(timeOrder)return timeOrder;
        if(a.type!==b.type)return a.type==='sell'?-1:1;
        if(a.type==='buy'){
            const aReturn=modelReturn(a.item),bReturn=modelReturn(b.item);

            if(shares<100){skipped.push({item:event.item,at:event.at,price:event.price,cash,reason:perTrade+1e-8<event.price*100?'单笔上限不足一手':'现金不足一手'});continue}
            const cost=shares*event.price;cash-=cost;
            bought.set(key,{item:event.item,buyAt:event.at,buyPrice:event.price,shares,cost,sold:false});
        }else{
            const trade=bought.get(key);if(!trade||trade.sold)continue;
            trade.sold=true;trade.sellAt=event.at;trade.sellPrice=event.price;trade.proceeds=trade.shares*event.price;
            cash+=trade.proceeds;realized+=trade.proceeds-trade.cost;
        }
    }
    const trades=[...bought.values()];let marketValue=0,unrealized=0,missingMarks=0;
    for(const trade of trades){
        if(trade.sold)continue;
        const quote=options.quotes?.[trade.item.code],quoteDay=String(quote?.at||'').slice(0,10),poolDay=String(trade.item.mark_date||'').slice(0,10);
        const useQuote=quoteDay===through&&Number(quote.price)>0;
        const markPrice=useQuote?Number(quote.price):poolDay===through?Number(trade.item.mark_price):null;
        trade.markDate=useQuote?quote.at:poolDay;
        if(!Number.isFinite(markPrice)||markPrice<=0){missingMarks++;trade.markPrice=null;trade.marketValue=null;continue}
        trade.markPrice=markPrice;trade.marketValue=trade.shares*markPrice;
        marketValue+=trade.marketValue;unrealized+=trade.marketValue-trade.cost;
    }
    const equity=missingMarks?null:cash+marketValue,pnl=equity===null?null:equity-principal;

        bought:trades.length,sold:trades.filter(item=>item.sold).length,holding:trades.filter(item=>!item.sold).length,skipped,pending,missingPrices,missingMarks,trades};
}

const consolidationDatePromises=new Map();
async function loadDailyConsolidationDate(selected){
    if(!selected)return;
    const view=dailyConsolidationDateRecords();
    const snapshotDates=[...new Set(view.recordsOnDate(dateKey(selected)).map(item=>dateKey(item.snapshot.date)))];
    await Promise.all(snapshotDates.map(async stamp=>{
        const sessions=dailyExtra.dailyConsolidationSessions?.sessions||[];
        const index=sessions.findIndex(item=>dateKey(item.date)===stamp);
        if(index<0)return; // Current rows already have their complete evidence.
        if(!consolidationDatePromises.has(stamp)){
            const iso=`${stamp.slice(0,4)}-${stamp.slice(4,6)}-${stamp.slice(6,8)}`,name=`page/consolidation_${iso}`;
            const promise=readPageAsset(name).then(payload=>{sessions[index]=payload.session}).catch(error=>{consolidationDatePromises.delete(stamp);throw error});
            consolidationDatePromises.set(stamp,promise);
        }
        await consolidationDatePromises.get(stamp);
    }));
}
let holdingPoolRefreshPromise=null,lastHoldingPoolFetchAt=0;
async function refreshHoldingPoolData(){
    if(location.protocol==='file:')return;
    if(holdingPoolRefreshPromise)return holdingPoolRefreshPromise;
    if(Date.now()-lastHoldingPoolFetchAt<30000)return;
    lastHoldingPoolFetchAt=Date.now();
    // Pool reconciliation must not wait for unrelated model/history downloads.
    holdingPoolRefreshPromise=(async()=>{
        try{
            const {payload}=await fetchLiveJson('holding_tracking_pool.json');
            if(!Array.isArray(payload?.positions)||!/^holding-tracking-pool-v\d+$/.test(payload.version||''))return;
            if(String(payload.generated_at||'')<=String(dailyExtra.holdingPool?.generated_at||''))return;
            dailyExtra.holdingPool=normalizeD2HoldingPool(payload);
            lastHoldingPoolRefresh=payload.generated_at||'';
            if(['d2_alert','holding_pool','stock_lookup'].includes(activeDaily))draw();
        }catch(error){console.warn('Holding pool refresh failed; retaining last snapshot',error)}
        finally{holdingPoolRefreshPromise=null}
    })();
    return holdingPoolRefreshPromise;
}
let shortCycleRefreshPromise=null,lastShortCycleFetchAt=0;
async function refreshShortCycleData(){
    if(location.protocol==='file:'||Date.now()-lastShortCycleFetchAt<300000)return;
    if(shortCycleRefreshPromise)return shortCycleRefreshPromise;
    lastShortCycleFetchAt=Date.now();
    const remoteHost=location.hostname.toLowerCase()==='waxwingin.github.io';
    const fetchLatest=async(name,live=false)=>{try{return (await fetchLiveJson(name,{live})).payload}catch(_error){return null}};
    shortCycleRefreshPromise=(async()=>{try{
        const [minute,outcomes,alertRates,holdingPool,valuationQuotes]=await Promise.all([fetchLatest('weekly_short_cycle_latest.json',true),fetchLatest('short_cycle_outcomes_latest.json',true),fetchLatest('short_cycle_alert_win_rates.json',true),fetchLatest('holding_tracking_pool.json',true),fetchLatest('holding_simulation_quotes.json',true)]);
        let changed=false;
        if(minute?.version==='weekly-short-cycle-v1'&&String(minute.generated_at||'')>String(lastShortCycleRefresh||'')){
            dailyExtra.weeklyShortCycle=minute;lastShortCycleRefresh=minute.generated_at;changed=true;
        }
        if(outcomes?.version==='short-cycle-appearance-outcomes-v1'&&String(outcomes.source_generated_at||'')>String(lastShortCycleOutcomeRefresh||'')){
            dailyExtra.shortCycleOutcomes=outcomes;lastShortCycleOutcomeRefresh=outcomes.source_generated_at;changed=true;
        }
        if(['short-cycle-alert-only-win-rates-v1','short-cycle-alert-only-win-rates-v2'].includes(alertRates?.version)&&String(alertRates.generated_at||'')>String(lastShortCycleAlertRateRefresh||'')){
            dailyExtra.shortCycleAlertRates=alertRates;lastShortCycleAlertRateRefresh=alertRates.generated_at;changed=true;
        }
        if(['holding-tracking-pool-v1','holding-tracking-pool-v2','holding-tracking-pool-v3','holding-tracking-pool-v4','holding-tracking-pool-v5','holding-tracking-pool-v6','holding-tracking-pool-v7','holding-tracking-pool-v8','holding-tracking-pool-v9','holding-tracking-pool-v10'].includes(holdingPool?.version)&&String(holdingPool.generated_at||'')>String(lastHoldingPoolRefresh||'')){
            dailyExtra.holdingPool=normalizeD2HoldingPool(holdingPool);lastHoldingPoolRefresh=holdingPool.generated_at;changed=true;
        }
        if(valuationQuotes?.quotes&&String(valuationQuotes.generated_at||'')>String(dailyExtra.holdingSimulationQuotes?.generated_at||'')){dailyExtra.holdingSimulationQuotes=valuationQuotes;changed=true;}
        if(changed&&['holding_pool','m30_first','daily_consolidation_first','two_centers','weekly_first','weekly_consolidation_first','stock_lookup'].includes(activeDaily))draw();
    }catch(_error){}finally{shortCycleRefreshPromise=null}})();
    return shortCycleRefreshPromise;
}
