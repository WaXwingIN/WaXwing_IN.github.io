<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WaXwing · 持仓管理</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="shortcut icon" href="favicon.ico">
  <style>
    body{font-family:"Microsoft YaHei",sans-serif;background:#f6f8fb;color:#172033;margin:0}
    main{width:min(1200px,92%);margin:28px auto}h1{margin:0 0 8px}
    .sub{color:#64748b;margin:0 0 24px}.card{background:#fff;border:1px solid #dce3ec;border-radius:10px;padding:18px;margin:14px 0}
    .empty{color:#64748b;padding:24px 0}.back{color:#64748b;text-decoration:none;font-size:14px}
    #editorCard,#addBtn,#resetBtn,.position .actions{display:none!important}
    button{border:1px solid #cbd5e1;border-radius:7px;background:#fff;padding:8px 13px;cursor:pointer}button.primary{background:#2563eb;color:#fff;border-color:#2563eb}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 4px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));column-gap:10px;row-gap:18px}.form label{display:grid;gap:8px;color:#475569;font-size:13px;line-height:1.4}.form input{padding:9px;border:1px solid #cbd5e1;border-radius:6px;font:inherit}.card>strong{display:block;margin-bottom:16px;font-size:16px}.position{border:1px solid #dce3ec;border-radius:8px;padding:14px;margin-top:12px}.position-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.lots{color:#64748b;font-size:14px;margin-top:9px}.up{color:#dc2626;font-weight:700}.down{color:#16a34a;font-weight:700}.flat{color:#64748b}.hidden{display:none!important}
    .plan{margin-top:13px;padding:12px 14px;border-radius:8px;background:#f8fafc;border-left:4px solid #94a3b8}.plan-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.plan-title{font-weight:700}.plan-date{color:#64748b;font-size:13px}.plan-badge{border-radius:999px;padding:3px 9px;font-size:13px;font-weight:700;background:#e2e8f0;color:#475569}.plan[data-level="strong"]{border-left-color:#dc2626;background:#fff7f7}.plan[data-level="strong"] .plan-badge{background:#fee2e2;color:#dc2626}.plan[data-level="hold"]{border-left-color:#2563eb;background:#f5f8ff}.plan[data-level="hold"] .plan-badge{background:#dbeafe;color:#1d4ed8}.plan[data-level="cautious"],.plan[data-level="protect"]{border-left-color:#d97706;background:#fffbeb}.plan[data-level="cautious"] .plan-badge,.plan[data-level="protect"] .plan-badge{background:#fef3c7;color:#b45309}.plan[data-level="risk"]{border-left-color:#64748b}.plan-reason,.plan-action{margin:8px 0 0;font-size:14px;line-height:1.55}.plan-reason{color:#475569}.plan-action{color:#172033}.plan-levels{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;color:#475569;font-size:13px}.plan-note{color:#94a3b8;font-size:12px;margin-top:10px}@media(max-width:640px){main{width:96%;margin:14px auto}.card{padding:12px}.position{padding:12px}.position-head>span{font-size:13px;line-height:1.7}.plan{padding:11px}}
  </style>
</head>
<body><main>
  <a class="back" href="index.html">← 返回市场观察</a>
  <h1>持仓管理</h1><p class="sub">Position Manager V1 · 独立于模型池可交易 · 仅生成分析与建议，不自动下单</p>
  <section class="card"><strong>最近检查：</strong>数据来自 positions.json
    <div id="summary" class="lots"></div>
    <div class="actions"><button class="primary" id="addBtn">新增持仓</button><button id="resetBtn">重置为 positions.json</button></div>
  </section>
  <section class="card hidden" id="editorCard"><strong>编辑持仓</strong>
    <form id="form"><div class="form">
      <label>股票代码<input name="code" required placeholder="002264"></label><label>股票名称<input name="name" required placeholder="新华都"></label>
      <label>买入日期（可留空）<input name="date" type="date"></label>
      <label>买入价<input name="price" type="number" step="0.001" required></label><label>数量<input name="qty" type="number" step="100" min="100" required></label>
      <label>券商当前成本价<input name="cost" type="number" step="0.001" required></label>
    </div><div class="actions"><button class="primary">保存</button><button type="button" id="cancelBtn">取消</button></div></form>
  </section>
  <section class="card"><div id="list"></div>
  </section>
</main></body></html>
<script>
const key='position-manager-v1-initial-20260918';let data={"account_capital":19933.61,"positions":[{"code":"603313","name":"梦百合","cost_price":6.785,"lots":[{"buy_datetime":"待补录","buy_price":6.785,"qty":200}]},{"code":"603668","name":"天马科技","cost_price":12.48,"lots":[{"buy_datetime":"待补录","buy_price":12.48,"qty":100}]},{"code":"002204","name":"大连重工","cost_price":5.576,"lots":[{"buy_datetime":"待补录","buy_price":5.576,"qty":200}]},{"code":"002214","name":"大立科技","cost_price":17.47,"lots":[{"buy_datetime":"待补录","buy_price":17.47,"qty":100}]},{"code":"002553","name":"南方精工","cost_price":15.672,"lots":[{"buy_datetime":"待补录","buy_price":15.672,"qty":100}]},{"code":"002721","name":"金一文化","cost_price":2.7104,"lots":[{"buy_datetime":"待补录","buy_price":2.7104,"qty":500}]}]};
const $=s=>document.querySelector(s), list=$('#list'), form=$('#form'), editorCard=$('#editorCard');
function save(){localStorage.setItem(key,JSON.stringify(data));render()}
function planHtml(q){const p=q['明日建议'];if(!p)return `<div class="plan" data-level="pending"><div class="plan-head"><span class="plan-title">明日建议</span><span class="plan-badge">等待生成</span></div><p class="plan-reason">请先刷新收盘行情与持仓计划。</p></div>`;const support=Number(p['防守参考价']),trigger=Number(p['转强确认价']);return `<div class="plan" data-level="${p['级别']||'pending'}"><div class="plan-head"><span class="plan-title">明日建议</span><span class="plan-date">${p['交易日']||''}</span><span class="plan-badge">${p['动作']||'等待生成'}</span></div><p class="plan-reason">${p['摘要']||''}</p><div class="plan-levels"><span>防守参考：<b>${Number.isFinite(support)?support.toFixed(2):'--'}</b></span><span>转强确认：<b>${Number.isFinite(trigger)?trigger.toFixed(2):'--'}</b></span></div><p class="plan-action"><b>执行：</b>${p['执行计划']||'--'}</p><div class="plan-note">规则计划，仅作盘前参考；以次日实际竞价和盘面为准。</div></div>`}
function render(){let total=0;list.innerHTML=data.positions.length?data.positions.map((p,i)=>{const q=data.quotes?.[p.code]||{},qty=p.lots.reduce((n,l)=>n+Number(l.qty),0),price=Number(q['现价']),cost=Number(p.cost_price),pnl=Number.isFinite(price)?(price-cost)*qty:null,change=Number(q['涨幅%']),changeClass=Number.isFinite(change)?(change>0?'up':change<0?'down':'flat'):'flat',pnlClass=Number.isFinite(pnl)?(pnl>0?'up':pnl<0?'down':'flat'):'flat';if(Number.isFinite(price))total+=price*qty;return `<article class="position"><div class="position-head"><strong>${p.name} ${p.code}</strong><span>成本价：${p.cost_price??'--'}　现价：${Number.isFinite(price)?price.toFixed(3):'--'}　总数量：${qty}</span></div><div class="lots">当日涨跌：<span class="${changeClass}">${Number.isFinite(change)?`${change>=0?'+':''}${change.toFixed(2)}%`:'--'}</span>　持仓浮盈亏：<span class="${pnlClass}">${pnl==null?'--':`${pnl>=0?'+':''}${pnl.toFixed(2)}`}</span></div><div class="lots">买入批次：${p.lots.map(l=>`${l.buy_datetime} / ${l.buy_price}元 / ${l.qty}股`).join('；')}</div>${planHtml(q)}<div class="actions"><button data-add="${i}">追加买入</button><button data-edit="${i}">编辑</button><button data-sell="${i}">部分卖出</button><button data-del="${i}">删除</button></div></article>`}).join(''):'<p class="empty">当前暂无持仓。</p>';$('#summary').textContent=`当前持仓总市值：${total?total.toFixed(2):'--'}`}
function openForm(p){if(p){const index=data.positions.indexOf(p),card=[...document.querySelectorAll('.position')][index];if(card)card.appendChild(editorCard)}else{const listCard=list.closest('.card');if(listCard)listCard.parentNode.insertBefore(editorCard,listCard)}editorCard.classList.remove('hidden');const dt=p?.lots?.[0]?.buy_datetime||'';const dateMatch=dt.match(/^\d{4}-\d{2}-\d{2}/);for(const [k,v] of Object.entries({code:p?.code||'',name:p?.name||'',date:dateMatch?dateMatch[0]:'',price:p?.lots?.[0]?.buy_price||'',qty:p?.lots?.[0]?.qty||'',cost:p?.cost_price||''}))form.elements[k].value=v;form.dataset.index=p?data.positions.indexOf(p):''}
$('#addBtn').onclick=()=>openForm();$('#cancelBtn').onclick=()=>editorCard.classList.add('hidden');$('#resetBtn').onclick=()=>{localStorage.removeItem(key);load()};
form.onsubmit=e=>{e.preventDefault();const f=new FormData(form),date=f.get('date'),p={code:f.get('code').trim(),name:f.get('name').trim(),cost_price:Number(f.get('cost')),lots:[{buy_datetime:date||'待补录',buy_price:Number(f.get('price')),qty:Number(f.get('qty'))}]};const i=form.dataset.index;if(i==='')data.positions.push(p);else{const old=data.positions[i];data.positions[i]={...old,code:p.code,name:p.name,cost_price:p.cost_price,lots:[p.lots[0],...(old.lots||[]).slice(1)]}}save();form.reset();editorCard.classList.add('hidden')};
list.onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=Number(Object.values(b.dataset)[0]),p=data.positions[i];if(b.dataset.del!==undefined&&confirm(`删除 ${p.name} ${p.code}？`)){data.positions.splice(i,1);save()}else if(b.dataset.edit!==undefined)openForm(p);else if(b.dataset.add!==undefined){const qty=Number(prompt('追加买入数量'));if(qty>0){const price=Number(prompt('买入价格'));const dt=prompt('买入日期时间（YYYY-MM-DD HH:MM）');if(price>0&&dt)p.lots.push({buy_datetime:dt,buy_price:price,qty});save()}}else if(b.dataset.sell!==undefined){const qty=Number(prompt('部分卖出数量'));let remain=qty;for(const l of [...p.lots].reverse()){const cut=Math.min(remain,l.qty);l.qty-=cut;remain-=cut;if(!remain)break}if(remain)alert('卖出数量超过持仓');else save()}};
async function load(){
  if(location.protocol!=='file:'){
    try{const [positions,quotes]=await Promise.all([fetch('data/positions.json',{cache:'no-store'}),fetch('data/position_quotes_latest.json',{cache:'no-store'})]);if(positions.ok){data=await positions.json();data.quotes=quotes.ok?(await quotes.json()).quotes:{};render();return}}catch(error){console.warn('持仓数据读取失败',error)}
  }
  render()
}load();
</script>
